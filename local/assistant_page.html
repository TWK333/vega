<!DOCTYPE html>
<html lang="zh-CN" class="bubble-mode">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vega 助理</title>
<style>
  /* 外观与 Nova 的 taskbar bubble 对齐：同一套语义色、同一套卡片/气泡/输入条几何。
     结构保留我们的两栏（左栏热心市民与群聊、右栏会话），配色与尺寸照 Nova。 */
  html.bubble-mode, html.bubble-mode body { margin: 0; background: transparent; overflow: hidden; height: 100%; }
  html.bubble-mode, html.bubble-mode * { box-sizing: border-box; }

  /* 跟随任务栏主题：默认深色，浅色任务栏时由脚本加 .light。--ink 是叠加色。 */
  html.bubble-mode {
    color-scheme: dark;
    --ink: 255 255 255;
    --fg: #f5f5f7;
    --fg-strong: #fff;
    --fg-body: #e5e5ea;
    --fg-2: #c7c7cc;
    --fg-3: #98989f;
    --fg-4: #6e6e73;
    --bg-top: #202128;
    --bg-bottom: #16171b;
    --surface: rgb(255 255 255 / 0.06);
    --brand: #91adff;
    --brand-fill: linear-gradient(135deg, #7c95ff 0%, #4f6fd8 100%);
    --shadow: 0 16px 40px rgba(0, 0, 0, 0.42), 0 2px 8px rgba(0, 0, 0, 0.28);
    --code-bg: rgba(0, 0, 0, 0.35);
    --field-bg: rgba(0, 0, 0, 0.3);
    --blue: #0a84ff;
    --link: #64d2ff;
    --orange: #ff9f0a;
    --on-orange: #1c1c1e;
    --green: #30d158;
    --red: #ff453a;
    --red-text: #ff6961;
    --gray: #8e8e93;
  }
  html.bubble-mode.light {
    color-scheme: light;
    --ink: 0 0 0;
    --fg: #1a1a1a;
    --fg-strong: #000;
    --fg-body: #2b2b2b;
    --fg-2: #424242;
    --fg-3: #616161;
    --fg-4: #8a8a8a;
    --bg-top: #f8f9fc;
    --bg-bottom: #f1f3f8;
    --surface: #fff;
    --brand: #4363c7;
    --brand-fill: linear-gradient(135deg, #6584f0 0%, #4363c7 100%);
    --shadow: 0 16px 40px rgba(30, 40, 80, 0.16), 0 2px 8px rgba(30, 40, 80, 0.08);
    --code-bg: rgba(0, 0, 0, 0.04);
    --field-bg: #fff;
    --blue: #005fb8;
    --link: #005fb8;
    --orange: #9d5d00;
    --on-orange: #fff;
    --green: #0f7b0f;
    --red: #c42b1c;
    --red-text: #c42b1c;
    --gray: #707070;
  }

  /* 不透明窗口，不留那圈 8px 透明边——卡片直接顶满窗口。 */
  .tb-shell { display: flex; flex-direction: column; height: 100vh; padding: 0; }
  /* 面板是普通窗口：页面铺满客户区，不再画气泡卡片那圈圆角/描边/阴影。 */
  .tb-card {
    --accent: var(--gray);
    position: relative; flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 10px;
    padding: 14px 16px 12px;
    border-radius: 0;
    color: var(--fg);
    font: 13px/1.55 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    background:
      radial-gradient(90% 40% at 100% 0%, color-mix(in srgb, var(--brand) 10%, transparent), transparent 70%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    border: 0;
    user-select: none; cursor: default;
  }
  .tb-card.running { --accent: var(--blue); }
  .tb-card.waiting { --accent: var(--orange); }
  .tb-card.done { --accent: var(--green); }
  .tb-card.error { --accent: var(--red); }

  .tb-head { display: flex; flex: none; align-items: center; gap: 8px; }
  .tb-fly { flex: none; overflow: visible; fill: var(--accent); }
  .tb-fly-body { fill: var(--fg); }
  .tb-wings { transform-box: fill-box; transform-origin: center; }
  .running .tb-wings { animation: tb-flap 0.6s ease-in-out infinite; }
  .waiting .tb-wings { animation: tb-flap 1.4s ease-in-out infinite; }
  @keyframes tb-flap { 50% { transform: scaleX(0.2); } }
  .tb-state { font-size: 13.5px; font-weight: 600; color: var(--fg-strong); letter-spacing: 0.01em; }
  .tb-time { font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
  .tb-head-text { min-width: 0; }
  .tb-head-text > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tb-close {
    margin-left: auto; display: grid; place-items: center;
    width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%;
    color: var(--fg-3); background: rgb(var(--ink) / 0.06); cursor: pointer;
    transition: background 120ms, color 120ms;
  }
  .tb-close:hover { background: rgb(var(--ink) / 0.14); color: var(--fg); }

  /* 两栏：左栏热心市民与群聊，右栏会话。 */
  .tb-panes { flex: 1; min-height: 0; display: flex; gap: 12px; }
  .tb-rail {
    flex: 0 0 172px; min-width: 0; display: flex; flex-direction: column;
    padding-right: 8px; border-right: 1px solid rgb(var(--ink) / 0.08);
  }
  .ta-section-title {
    display: flex; flex: none; align-items: center; justify-content: space-between; gap: 8px;
    padding: 0 2px 6px; font-size: 12px; font-weight: 600;
  }
  .ta-section-title > span { font-size: 10px; font-weight: 400; color: var(--fg-3); }
  .ta-session-list {
    min-height: 0; overflow-y: auto; overscroll-behavior: none;
    display: flex; flex-direction: column; gap: 5px; padding-right: 2px;
  }
  .ta-session-list.grow { flex: 1 1 auto; }
  .ta-session-list.short { flex: 0 1 auto; max-height: 34%; }
  .ta-session {
    flex: none; display: flex; flex-direction: column; gap: 2px; width: 100%;
    padding: 7px 10px; border: 1px solid rgb(var(--ink) / 0.06); border-radius: 10px;
    color: var(--fg); background: var(--surface); font: inherit; text-align: left; cursor: pointer;
    transition: border-color 120ms, background 120ms;
  }
  .ta-session:hover { border-color: color-mix(in srgb, var(--brand) 35%, transparent); }
  .ta-session.on { border-color: color-mix(in srgb, var(--brand) 55%, transparent); background: color-mix(in srgb, var(--brand) 10%, var(--surface)); }
  .ta-session-heading { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ta-session-heading strong { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; font-weight: 600; }
  /* 左栏卡片头像：22px 小圆角，执行任务的热心市民头像在左栏播放动画（driveAvatars 连左栏一起扫描；输入中不动）。 */
  .ta-session-face { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; color: #fff; background: var(--brand-fill); font-weight: 700; font-size: 10px; overflow: hidden; }
  .ta-session-face.bot { background: none; box-shadow: none; }
  .ta-session-face.bot .pixel-avatar { display: block; width: 100%; height: 100%; border-radius: inherit; image-rendering: pixelated; }
  .ta-status { flex: none; color: var(--fg-3); font-size: 10px; }
  .ta-status.running { color: var(--blue); }
  .ta-status.waiting { color: var(--orange); }
  .ta-status.done { color: var(--green); }
  .ta-status.error { color: var(--red-text); }
  .ta-session-text {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden;
    white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg-2); font-size: 11px; line-height: 1.5;
  }
  .ta-badge {
    flex: none; min-width: 16px; height: 16px; padding: 0 5px; border-radius: 8px;
    background: var(--brand); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center;
  }
  .ta-empty { padding: 6px 2px; color: var(--fg-3); font-size: 11px; }

  .tb-chat { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .ta-chat { position: relative; display: flex; flex: 1; min-height: 0; overflow: hidden; }
  .ta-history {
    flex: 1; min-width: 0; min-height: 0; overflow-y: auto; overflow-anchor: none;
    overscroll-behavior: none; padding: 4px 6px 4px 2px; outline-offset: -2px;
  }
  .ta-welcome { padding: 56px 12px; text-align: center; font-size: 15px; font-weight: 600; color: var(--fg); }
  .ta-welcome small { display: block; margin-top: 8px; font-size: 12px; font-weight: 400; color: var(--fg-3); }
  .ta-welcome code { padding: 1px 5px; border-radius: 4px; background: rgb(var(--ink) / 0.08); font-size: 11px; }
  /* 「新」分界：切进线程时上次看到的位置之后是新消息；来了新消息或切出再进来就不再出现。 */
  .ta-new { display: flex; align-items: center; gap: 10px; margin: 2px 0 12px; color: var(--brand); font-size: 11px; font-weight: 600; }
  .ta-new::before, .ta-new::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: 0.3; }
  /* 占位留着，收起时下面的内容不会跳。 */
  .ta-new.gone { visibility: hidden; }

  .ta-message { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 14px; }
  .ta-message.user { flex-direction: row-reverse; }
  .ta-avatar {
    flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px;
    color: #fff; background: var(--brand-fill); box-shadow: 0 2px 6px color-mix(in srgb, var(--brand) 30%, transparent);
    font-weight: 700; font-size: 12px; overflow: hidden;
  }
  /* 热心市民像素小人 SVG 头像：圆角底卡由 SVG 绘制，主体像素保持锐利。 */
  .ta-avatar.bot { background: none; box-shadow: none; }
  .ta-avatar.bot .pixel-avatar { display: block; width: 100%; height: 100%; border-radius: inherit; image-rendering: pixelated; }
  .ta-message.user .ta-avatar { display: none; }
  .ta-message-content { min-width: 0; max-width: calc(100% - 44px); }
  .ta-message.user .ta-message-content { max-width: 82%; }
  .ta-author { margin: 0 2px 4px; font-size: 11px; color: var(--fg-3); }
  .ta-bubble {
    position: relative; padding: 9px 13px; border: 1px solid rgb(var(--ink) / 0.06);
    border-radius: 4px 14px 14px 14px; white-space: pre-wrap; overflow-wrap: anywhere;
    user-select: text; line-height: 1.6; color: var(--fg-body); background: var(--surface);
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.04);
  }
  .ta-message.user .ta-bubble {
    border: 0; border-radius: 14px 4px 14px 14px; color: #fff; background: var(--brand-fill);
    box-shadow: 0 3px 10px color-mix(in srgb, var(--brand) 28%, transparent);
  }
  .ta-bubble.md { white-space: normal; }
  /* 待确认卡片本身是橙框，外层不再需要气泡底。 */
  .ta-bubble.ask { padding: 0; border: 0; background: transparent; box-shadow: none; }
  .ta-bubble.error { color: var(--red-text); border-color: color-mix(in srgb, var(--red) 40%, transparent); background: color-mix(in srgb, var(--red) 8%, var(--surface)); }
  .ta-bubble.progress { color: var(--fg-2); background: rgb(var(--ink) / 0.03); }
  .ta-bubble.typing { color: var(--fg-3); }
  .ta-message-meta { display: flex; align-items: center; gap: 10px; margin: 5px 0 0 2px; color: var(--fg-3); font-size: 11px; }
  .ta-message.user .ta-message-meta { justify-content: flex-end; }
  .ta-notice { display: flex; justify-content: center; margin: 0 0 14px; }
  .ta-notice span {
    padding: 3px 12px; border-radius: 999px; background: rgb(var(--ink) / 0.05);
    color: var(--fg-3); font-size: 11px;
  }
  .ta-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .ta-chip {
    display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px;
    border: 1px solid rgb(var(--ink) / 0.08); border-radius: 8px; background: rgb(var(--ink) / 0.04);
    color: var(--fg-2); font-size: 11px;
  }
  .ta-message.user .ta-chip { border-color: rgb(255 255 255 / 0.3); background: rgb(255 255 255 / 0.16); color: #fff; }
  .ta-step-output { display: grid; gap: 6px; margin-top: 6px; padding: 10px 12px; border: 1px solid rgb(var(--ink) / 0.1); border-radius: 12px; background: var(--surface); overflow-wrap: anywhere; }
  .ta-step-output strong { font-size: 12px; }
  .ta-step-output summary { color: var(--brand); cursor: pointer; font-size: 11px; }
  .ta-step-output .ta-md { margin-top: 8px; user-select: text; }
  .ta-step-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .ta-step-actions button { padding: 4px 8px; border: 1px solid rgb(var(--ink) / 0.1); border-radius: 8px; color: var(--fg); background: rgb(var(--ink) / 0.04); font: inherit; font-size: 11px; cursor: pointer; }
  .ta-step-actions button:disabled { opacity: .5; cursor: default; }

  /* markdown（与 Nova 的 .ta-md 同一套规则） */
  .ta-md > :first-child { margin-top: 0; }
  .ta-md > :last-child { margin-bottom: 0; }
  .ta-md :is(p, ul, ol, pre, blockquote, table) { margin: 0 0 8px; }
  .ta-md :is(ul, ol) { padding-left: 20px; }
  .ta-md li { margin: 2px 0; }
  .ta-md :is(h1, h2, h3, h4) { margin: 10px 0 6px; font-size: 1em; font-weight: 650; }
  .ta-md code { padding: 1px 4px; border-radius: 4px; font-size: 0.92em; background: rgb(var(--ink) / 0.06); }
  .ta-md pre { padding: 8px 10px; overflow-x: auto; border-radius: 8px; background: rgb(var(--ink) / 0.05); overscroll-behavior: none; }
  .ta-md pre code { padding: 0; background: none; }
  .ta-md a { color: var(--brand); text-decoration: none; }
  .ta-md a:hover { text-decoration: underline; }
  .ta-md blockquote { padding-left: 10px; border-left: 3px solid rgb(var(--ink) / 0.12); color: var(--fg-3); }
  .ta-md table { border-collapse: collapse; font-size: 0.92em; }
  .ta-md :is(th, td) { padding: 4px 8px; border: 1px solid rgb(var(--ink) / 0.1); }
  .ta-md img { max-width: 100%; border-radius: 8px; }
  .ta-md hr { border: 0; border-top: 1px solid rgb(var(--ink) / 0.1); margin: 10px 0; }

  /* 待确认气泡（Nova 的 tb-ask）：审批/提问直接坐在消息流里，不必再打字。 */
  .tb-ask {
    display: flex; flex-direction: column; gap: 8px; margin-top: 8px;
    padding: 10px 12px 12px; border-radius: 14px;
    background: color-mix(in srgb, var(--orange) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--orange) 28%, transparent);
  }
  .tb-ask-head { display: flex; align-items: center; gap: 8px; }
  .tb-ask-badge {
    padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    color: var(--on-orange); background: var(--orange);
  }
  .tb-ask-agent, .tb-ask-thread { font-size: 12px; color: var(--fg-3); overflow-wrap: anywhere; }
  .tb-ask-title { font-weight: 600; overflow-wrap: anywhere; }
  .tb-code {
    margin: 0; max-height: 120px; overflow: auto; padding: 8px 10px; border-radius: 10px;
    background: var(--code-bg); border: 1px solid rgb(var(--ink) / 0.06);
    font-family: "Cascadia Code", Consolas, "JetBrains Mono", monospace; font-size: 12px;
    white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg-body); user-select: text;
  }
  .tb-question { display: flex; flex-direction: column; gap: 6px; }
  .tb-question-head { font-size: 11px; font-weight: 600; color: var(--orange); text-transform: uppercase; letter-spacing: 0.04em; }
  .tb-input {
    padding: 7px 10px; border-radius: 10px; border: 1px solid rgb(var(--ink) / 0.12);
    background: var(--field-bg); color: var(--fg); font: inherit; outline: none; resize: none; user-select: text;
  }
  .tb-input:focus { border-color: var(--blue); }
  .tb-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .tb-btn {
    padding: 6px 14px; border: 0; border-radius: 9px; font: inherit; font-weight: 600;
    color: var(--fg); background: rgb(var(--ink) / 0.1); cursor: pointer;
    transition: filter 120ms, background 120ms, transform 80ms;
  }
  .tb-btn:hover { background: rgb(var(--ink) / 0.16); }
  .tb-btn:active { transform: scale(0.97); }
  .tb-btn.allow { background: var(--blue); color: #fff; }
  .tb-btn.allow:hover { filter: brightness(1.12); }
  .tb-btn.reject { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red-text); }
  .tb-btn.reject:hover { background: color-mix(in srgb, var(--red) 22%, transparent); }
  .tb-btn:disabled { opacity: 0.45; cursor: default; transform: none; }

  .ta-dots { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
  .ta-dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; animation: ta-dot 1.2s infinite ease-in-out; }
  .ta-dots i:nth-child(2) { animation-delay: 0.15s; }
  .ta-dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes ta-dot { 0%, 60%, 100% { opacity: 0.25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { .ta-dots i, .tb-wings { animation: none; } }

  .ta-latest {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    padding: 4px 12px; border: 1px solid rgb(var(--ink) / 0.1); border-radius: 999px;
    color: var(--brand); background: var(--surface); box-shadow: 0 4px 12px rgb(0 0 0 / 0.12);
    font: inherit; font-size: 11px; cursor: pointer; transition: opacity 120ms, transform 120ms;
  }
  .ta-latest[hidden] { display: none; }

  .ta-compose {
    position: relative; flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: end; gap: 2px 6px; padding: 5px;
    border: 1px solid rgb(var(--ink) / 0.1); border-radius: 14px; background: var(--surface);
    box-shadow: 0 2px 8px rgb(0 0 0 / 0.05);
  }
  .ta-input {
    width: 100%; min-height: 34px; max-height: 96px; padding: 6px 8px; border: 0; background: transparent;
    color: var(--fg); font: inherit; line-height: 1.5; resize: none; outline: none; user-select: text;
    field-sizing: content;
  }
  .ta-input::placeholder { color: var(--fg-4); }
  .ta-plus, .ta-submit {
    display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 10px;
    font: inherit; cursor: pointer; transition: filter 120ms, background 120ms, transform 80ms, opacity 120ms;
  }
  .ta-plus { color: var(--fg-3); background: transparent; font-size: 19px; line-height: 1; }
  .ta-plus:hover, .ta-plus.open { color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, transparent); }
  .ta-plus.open { transform: rotate(45deg); }
  .ta-submit { background: var(--brand-fill); color: #fff; font-size: 15px; }
  .ta-submit:hover { filter: brightness(1.08); }
  .ta-submit:active { transform: scale(0.95); }
  .ta-submit:disabled { opacity: 0.35; cursor: default; filter: none; transform: none; }
  .ta-error { grid-column: 1 / -1; padding: 0 8px 2px; color: var(--red-text); font-size: 10.5px; }
  .ta-error[hidden] { display: none; }
  .ta-menu {
    position: absolute; z-index: 5; left: 0; bottom: calc(100% + 6px); display: flex; flex-direction: column;
    min-width: 132px; padding: 4px; border: 1px solid rgb(var(--ink) / 0.1); border-radius: 12px;
    background: var(--bg-top); box-shadow: var(--shadow);
  }
  .ta-menu[hidden] { display: none; }
  .ta-menu > button {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 0; border-radius: 8px;
    color: var(--fg); background: transparent; font: inherit; text-align: left; cursor: pointer; white-space: nowrap;
  }
  .ta-menu > button:hover { background: color-mix(in srgb, var(--brand) 10%, transparent); }

  /* 滚动条也照 Nova：6px，只限定卡片内（Nova 是 .tb-card ::-webkit-scrollbar）。 */
  .tb-card ::-webkit-scrollbar { width: 6px; height: 6px; }
  .tb-card ::-webkit-scrollbar-thumb { border-radius: 3px; background: rgb(var(--ink) / 0.16); }
  .tb-card ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="tb-shell">
  <div class="tb-card" id="card">
    <div class="tb-head">
      <svg class="tb-fly" viewBox="-8 -7 16 13" width="16" height="13" aria-hidden="true">
        <g class="tb-wings">
          <path d="M0.5-0.5L1.8-4.4L4.4-6L7-5.2L7-2.6L0.5 0.6ZM0.5 0.6L4.6 1L5 3.4L2.8 5.2L0.5 2.8Z"/>
          <path d="M0.5-0.5L1.8-4.4L4.4-6L7-5.2L7-2.6L0.5 0.6ZM0.5 0.6L4.6 1L5 3.4L2.8 5.2L0.5 2.8Z" transform="scale(-1 1)"/>
        </g>
        <rect class="tb-fly-body" x="-0.9" y="-4.6" width="1.8" height="9.2" rx="0.9"/>
      </svg>
      <div class="tb-head-text">
        <div class="tb-state" id="who">Vega 助理</div>
        <div class="tb-time" id="sub">选择一位热心市民或一个群聊</div>
      </div>
      <button class="tb-close" id="settings" title="设置">⚙</button>
      <button class="tb-close" id="close" title="收起">×</button>
    </div>

    <div class="tb-panes">
      <aside class="tb-rail">

/* 热心市民像素小人头像：与 web/src/pixel-rig.js + pixel-rig-angles.js + pixel-roles-*.js + pixel-avatar.js（64×64 多视角 2.5D 骨骼拆分 + 每职业 5 组 20–30 帧 / 3–6s 丰富剧情动画）同步，暴露 window.PixelAvatar。 */
(function () {
// 64×64 Multi-Angle ("Pixel 3D" / 2.5D) Skeletal Pixel Rig & Keyframe Arc-Interpolation Engine.
// Each character consists of 7 independent 64×64 skeletal parts (head, torso, armL, armR, legL, legR, prop)

const PIXEL_GRID_SIZE = 64;
const RIG_PARTS = Object.freeze(["head", "torso", "armL", "armR", "legL", "legR", "prop"]);
const RIG_ANGLES = Object.freeze(["front", "side", "back"]);

/** Mix a #rrggbb color toward white (amount > 0) or black (amount < 0). */
function shade(hex, amount) {
  const clean = /^#[0-9a-fA-F]{6}$/.test(hex || "") ? hex : "#3878fb";
  const n = parseInt(clean.slice(1), 16), t = amount < 0 ? 0 : 255, k = Math.abs(amount);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.round(v + (t - v) * k));
  return "#" + c.map((v) => v.toString(16).padStart(2, "0")).join("");
}

// ============================================================================
// Low-level 64×64 Grid Primitives & Pixel-Art 2× Bevel Upscaler
// ============================================================================

function blank(size = PIXEL_GRID_SIZE) {
  return Array.from({ length: size }, () => Array(size).fill("."));
}

function clone(src) {
  return src.map((row) => [...row]);
}

function px(g, x, y, ch) {
  if (x >= 0 && x < g.length && y >= 0 && y < g.length) g[y][x] = ch;
  return g;
}

function fill(g, x, y, w, h, ch) {
  const n = g.length;
  for (let r = y; r < y + h; r++) {
    if (r < 0 || r >= n) continue;
    for (let c = x; c < x + w; c++) {
      if (c >= 0 && c < n) g[r][c] = ch;
    }
  }
  return g;
}

/** Stamp a native-resolution ASCII patch at (ox, oy). `.` keeps existing pixel, `_` erases to transparent. */
function stamp(target, ox, oy, lines) {
  const n = target.length;
  for (let r = 0; r < lines.length; r++) {
    const y = oy + r;
    if (y < 0 || y >= n) continue;
    const row = lines[r];
    for (let c = 0; c < row.length; c++) {
      const x = ox + c;
      if (x < 0 || x >= n) continue;
      const ch = row[c];
      if (ch === ".") continue;
      target[y][x] = ch === "_" ? "." : ch;
    }
  }
  return target;
}

/**
 * Stamp a 64×64-coordinate ASCII art patch into 64×64 space using EPX-style pixel-art corner beveling,
 * turning chunky diagonal staircases into crisp, organic 64×64 pixel curves while staying 100% pixel art.
 */
function stamp2x(target, ox32, oy32, lines, smooth = true) {
  const h = lines.length, w = Math.max(0, ...lines.map((l) => l.length));
  const at = (c, r) => (r >= 0 && r < h && c >= 0 && c < lines[r].length ? lines[r][c] : ".");
  const solid = (ch) => ch !== "." && ch !== "_";
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < lines[r].length; c++) {
      const P = at(c, r);
      if (P === ".") continue;
      const x = (ox32 + c) * 2, y = (oy32 + r) * 2;
      if (P === "_") {
        fill(target, x, y, 2, 2, ".");
        continue;
      }
      if (!smooth) {
        fill(target, x, y, 2, 2, P);
        continue;
      }
      const U = at(c, r - 1), D = at(c, r + 1), L = at(c - 1, r), R = at(c + 1, r);
      let q0 = P, q1 = P, q2 = P, q3 = P;
      // EPX corner smoothing: blend inner corners where orthogonal neighbors match & differ from opposite pair
      if (U === L && U !== D && L !== R && solid(U)) q0 = U;
      if (U === R && U !== D && R !== L && solid(U)) q1 = U;
      if (D === L && D !== U && L !== R && solid(D)) q2 = D;
      if (D === R && D !== U && R !== L && solid(D)) q3 = D;
      // Outer silhouette corner chamfer: soften isolated 90° protruding corners on multi-pixel shapes
      const count = (solid(U) ? 1 : 0) + (solid(D) ? 1 : 0) + (solid(L) ? 1 : 0) + (solid(R) ? 1 : 0);
      if (count >= 2) {
        if (!solid(U) && !solid(L) && solid(D) && solid(R)) q0 = ".";
        if (!solid(U) && !solid(R) && solid(D) && solid(L)) q1 = ".";
        if (!solid(D) && !solid(L) && solid(U) && solid(R)) q2 = ".";
        if (!solid(D) && !solid(R) && solid(U) && solid(L)) q3 = ".";
      }
      if (q0 !== ".") px(target, x, y, q0);
      if (q1 !== ".") px(target, x + 1, y, q1);
      if (q2 !== ".") px(target, x, y + 1, q2);
      if (q3 !== ".") px(target, x + 1, y + 1, q3);
    }
  }
  return target;
}

/** Stamp a 32-space FX patch directly at native 64×64 pixel offset (ox64, oy64) so 1px 64×64 drift is crisp. */
function stamp2xAt64(target, ox64, oy64, lines) {
  for (let r = 0; r < lines.length; r++) {
    const row = lines[r];
    for (let c = 0; c < row.length; c++) {
      const ch = row[c];
      if (ch === ".") continue;
      fill(target, ox64 + c * 2, oy64 + r * 2, 2, 2, ch === "_" ? "." : ch);
    }
  }
  return target;
}

/** Create a 64×64 part sprite from a 32-space patch (with EPX pixel beveling for smooth 64×64 pixel craft). */
function partPatch(ox32, oy32, lines, smooth = true) {
  return stamp2x(blank(), ox32, oy32, lines, smooth);
}

/** Create a 64×64 part sprite directly from native 64×64 coordinates. */
function partNative(ox64, oy64, lines) {
  return stamp(blank(), ox64, oy64, lines);
}

/** Horizontally flip a 64×64 part around the center axis (x ↔ 63 - x). */
function flipMatrixH(src) {
  const n = src.length, out = blank(n);
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const ch = src[y][x];
      if (ch !== ".") out[y][n - 1 - x] = ch;
    }
  }
  return out;
}

function blitPart(target, src, dx = 0, dy = 0, flip = false) {
  if (!src) return;
  const n = target.length, mat = flip ? flipMatrixH(src) : src;
  for (let y = 0; y < n; y++) {
    const ny = y + dy;
    if (ny < 0 || ny >= n) continue;
    const row = mat[y];
    for (let x = 0; x < n; x++) {
      const ch = row[x];
      if (ch === ".") continue;
      const nx = x + dx;
      if (nx >= 0 && nx < n) target[ny][nx] = ch;
    }
  }
}

/** Add a delicate, crisp 1px native-64×64 dark-ink outline around solid body/prop pixels (skipping `Z`). */
function outline(src, ch = "O") {
  const n = src.length, out = clone(src);
  const solid = (x, y) => {
    if (x < 0 || x >= n || y < 0 || y >= n) return false;
    const c = src[y][x];
    return c !== "." && c !== "Z" && c !== ch;
  };
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      if (src[y][x] !== ".") continue;
      if (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1)) out[y][x] = ch;
    }
  }
  return out;
}

function blitAfterimage(target, src, dx, dy, tint = "c") {
  const n = target.length;
  for (let y = 0; y < n; y++) {
    const ny = y + dy;
    if (ny < 0 || ny >= n) continue;
    for (let x = 0; x < n; x++) {
      const ch = src[y][x];
      if (ch === "." || ch === "Z") continue;
      const nx = x + dx;
      if (nx >= 0 && nx < n && target[ny][nx] === ".") target[ny][nx] = tint;
    }
  }
}

function petrifyMatrix(src) {
  const map = {
    S: "w", s: "G", P: "w", m: "g", A: "G", a: "w", d: "g", H: "g", h: "G", k: "O",
    N: "g", n: "G", B: "g", b: "G", R: "g", Y: "w", F: "G", C: "w", V: "G", M: "G", U: "g",
  };
  return src.map((row) => row.map((c) => map[c] || c));
}

function scaleMatrix(src, factor) {
  const n = src.length, out = blank(n);
  const dstSize = Math.max(8, Math.round(n * factor));
  const ox = Math.floor((n - dstSize) / 2);
  const oy = Math.min(n - 6 - dstSize, Math.round(58 - dstSize));
  for (let y = 0; y < dstSize; y++) {
    const sy = Math.min(n - 1, Math.floor(y / factor));
    for (let x = 0; x < dstSize; x++) {
      const sx = Math.min(n - 1, Math.floor(x / factor));
      const c = src[sy][sx];
      if (c && c !== "." && c !== "Z") px(out, ox + x, oy + y, c);
    }
  }
  return out;
}

      stamp(c, 22, 22, ["WWWW", "WEEW", "WEEW", "WWWW"]);
      stamp(c, 38, 22, ["WWWW", "WEEW", "WEEW", "WWWW"]);
      stamp(c, 29, 28, [".OOOO.", "ORRRRO", "ORRRRO", ".OOOO."]);
      return c;
    })();
  }
  if (spec.extraHeads) Object.assign(parts, spec.extraHeads(normal, mod));
  return parts;
}

/** Build native 64×64 detailed occupation torso with 5 smooth lean variants (normal, leanL1, leanL, leanR1, leanR). */
function buildTorsoParts(coat = "hoodie", extraTorso) {
  const g = blank();
  fill(g, 28, 33, 8, 3, "s"); // neck

  if (coat === "hoodie") {
    fill(g, 20, 36, 24, 14, "A"); fill(g, 20, 36, 6, 4, "a"); fill(g, 38, 40, 6, 10, "d"); fill(g, 20, 48, 24, 2, "d");
    fill(g, 28, 37, 2, 5, "W"); fill(g, 34, 37, 2, 5, "W");
    fill(g, 24, 44, 16, 4, "d"); fill(g, 26, 44, 12, 2, "A");
  } else if (coat === "labcoat") {
    fill(g, 20, 36, 24, 14, "W"); fill(g, 26, 36, 12, 14, "A"); fill(g, 26, 36, 4, 4, "a");
    fill(g, 20, 46, 6, 4, "w"); fill(g, 38, 46, 6, 4, "w");
    fill(g, 21, 42, 4, 1, "w"); fill(g, 39, 42, 4, 1, "w"); // pockets
  } else if (coat === "chef") {
    fill(g, 20, 36, 24, 14, "W"); fill(g, 38, 40, 6, 10, "w"); fill(g, 20, 48, 24, 2, "w");
    stamp(g, 26, 34, ["..aaaaaaaa..", "aaAAAAAAAAdd", "..AAAAdddd..", "....AAdd...."]);
    fill(g, 27, 40, 2, 2, "g"); fill(g, 35, 40, 2, 2, "g");
    fill(g, 27, 44, 2, 2, "g"); fill(g, 35, 44, 2, 2, "g");
  } else if (coat === "apron") {
    fill(g, 20, 36, 24, 14, "W"); fill(g, 24, 36, 16, 14, "A"); fill(g, 24, 36, 4, 4, "a");
    fill(g, 36, 40, 4, 10, "d"); fill(g, 20, 46, 4, 4, "w"); fill(g, 40, 46, 4, 4, "w");
    fill(g, 27, 44, 10, 3, "d"); fill(g, 28, 44, 8, 2, "a"); // front pocket
  } else if (coat === "cafe") {
    fill(g, 20, 36, 24, 14, "W"); fill(g, 24, 38, 16, 12, "B");
    fill(g, 24, 36, 2, 4, "B"); fill(g, 38, 36, 2, 4, "B");
    fill(g, 28, 42, 8, 4, "A"); fill(g, 29, 43, 6, 2, "a"); fill(g, 36, 40, 4, 10, "K");
  } else if (coat === "trench") {
    fill(g, 20, 36, 24, 14, "b"); fill(g, 28, 36, 8, 6, "W"); fill(g, 30, 36, 4, 8, "A");
    fill(g, 20, 44, 24, 2, "B"); fill(g, 30, 44, 4, 2, "Y"); fill(g, 38, 40, 6, 10, "B");
  } else if (coat === "fire") {
    fill(g, 20, 36, 24, 14, "A"); fill(g, 38, 40, 6, 10, "d");
    fill(g, 20, 40, 24, 2, "Y"); fill(g, 20, 46, 24, 2, "Y"); fill(g, 30, 36, 4, 14, "g");
  } else if (coat === "vest") {
    fill(g, 20, 36, 24, 14, "W"); fill(g, 22, 36, 20, 14, "A");
    fill(g, 28, 36, 8, 4, "W"); fill(g, 30, 38, 4, 2, "d"); fill(g, 38, 40, 4, 10, "d");
  } else if (coat === "overalls") {
    fill(g, 20, 36, 24, 14, "W"); fill(g, 22, 40, 20, 10, "A");
    fill(g, 24, 36, 4, 4, "A"); fill(g, 36, 36, 4, 4, "A");
    fill(g, 25, 40, 2, 2, "Y"); fill(g, 37, 40, 2, 2, "Y"); fill(g, 28, 44, 8, 4, "d");
  } else if (coat === "robe") {
    fill(g, 18, 36, 28, 16, "A"); fill(g, 18, 36, 6, 4, "a"); fill(g, 40, 40, 6, 12, "d");
    fill(g, 28, 36, 8, 16, "d"); fill(g, 30, 40, 4, 2, "Y"); fill(g, 30, 44, 4, 2, "Y"); fill(g, 30, 48, 4, 2, "Y");
  } else if (coat === "jersey") {
    fill(g, 20, 36, 24, 14, "A"); fill(g, 20, 36, 6, 4, "a"); fill(g, 38, 40, 6, 10, "d");
    fill(g, 27, 36, 10, 2, "W"); stamp(g, 28, 40, ["WWWWWWWW", "..WWWW..", "..WWWW..", "..WWWW..", "..WWWW.."]);
  } else if (coat === "pilot") {
    fill(g, 20, 36, 24, 14, "A"); fill(g, 20, 36, 6, 2, "Y"); fill(g, 38, 36, 6, 2, "Y");
    fill(g, 28, 36, 8, 8, "W"); fill(g, 30, 36, 4, 8, "O"); fill(g, 38, 40, 6, 10, "d");
    fill(g, 23, 40, 4, 2, "Y");
  } else if (coat === "ninja") {
    fill(g, 20, 36, 24, 14, "N"); fill(g, 38, 40, 6, 10, "O");
    stamp2x(g, 12, 19, ["aA....Aa", "..aAAa..", "....AA.."], false);
    fill(g, 20, 46, 24, 2, "A");
  } else if (coat === "spacesuit") {
    fill(g, 18, 34, 28, 18, "W"); fill(g, 40, 38, 6, 14, "w");
    fill(g, 22, 34, 20, 4, "A");
    fill(g, 26, 40, 12, 6, "g"); fill(g, 28, 42, 2, 2, "R"); fill(g, 32, 42, 2, 2, "V"); fill(g, 35, 42, 2, 2, "C");
    fill(g, 18, 48, 28, 4, "A");
  } else {
    fill(g, 20, 36, 24, 14, "A"); fill(g, 20, 36, 6, 4, "a"); fill(g, 28, 36, 8, 14, "W"); fill(g, 38, 40, 6, 10, "d");
  }

  if (extraTorso) extraTorso(g);

  const makeLean = (dir, mag) => {
    const out = blank();
    for (let y = 33; y <= 51; y++) {
      const shift = y <= 41 ? dir * mag : y <= 45 ? dir * Math.trunc(mag / 2) : 0;
      for (let x = 0; x < PIXEL_GRID_SIZE; x++) {
        if (g[y][x] !== ".") px(out, x + shift, y, g[y][x]);
      }
    }
    return out;
  };
  return {
    normal: g,
    leanL1: makeLean(-1, 1),
    leanL: makeLean(-1, 2),
    leanR1: makeLean(1, 1),
    leanR: makeLean(1, 2),
  };
}

/**
 * Build 10 articulated 64×64 left-arm poses & 11 right-arm poses with smooth intermediate arc angles!
 * Arc order: back ↔ down ↔ lowOut ↔ mid ↔ highOut ↔ up; down ↔ forwardLow ↔ forward ↔ forwardHigh ↔ salute.
 */
function buildArmParts({ sleeveL = "A", sleeveR = "d", hand = "S", cuff = null } = {}) {
  const drawLimb = (g, segments, s, h) => {
    for (const [x, y, w, hh, col] of segments) fill(g, x, y, w, hh, col === "s" ? s : col === "h" ? h : col);
  };
  const mkL = (segs) => { const g = blank(); drawLimb(g, segs, sleeveL, hand); return g; };
  const mkR = (segs) => { const g = blank(); drawLimb(g, segs, sleeveR, hand); return g; };
  const cL = cuff ? [[16, 42, 4, 2, cuff]] : [];
  const cR = cuff ? [[44, 42, 4, 2, cuff]] : [];

  const armL = {
    back: mkL([[15, 36, 5, 4, "s"], [13, 40, 4, 5, "s"], [11, 44, 4, 4, "h"]]),
    down: mkL([[16, 36, 4, 8, "s"], ...cL, [16, 44, 4, 4, "h"]]),
    lowOut: mkL([[15, 36, 5, 4, "s"], [12, 39, 5, 4, "s"], [10, 42, 4, 4, "h"]]),
    mid: mkL([[12, 36, 8, 4, "s"], [8, 36, 4, 4, "h"]]),
    highOut: mkL([[15, 34, 5, 4, "s"], [12, 30, 4, 5, "s"], [9, 27, 4, 4, "h"]]),
    up: mkL([[14, 34, 6, 4, "s"], [12, 28, 4, 6, "s"], [12, 24, 4, 4, "h"]]),
    forwardLow: mkL([[16, 36, 4, 5, "s"], [18, 40, 4, 4, "s"], [20, 43, 4, 4, "h"]]),
    forward: mkL([[16, 36, 4, 6, "s"], [18, 40, 6, 4, "s"], [22, 41, 4, 4, "h"]]),
    forwardHigh: mkL([[16, 36, 4, 5, "s"], [18, 37, 5, 4, "s"], [21, 35, 4, 4, "h"]]),
    flex: mkL([[14, 36, 6, 4, "s"], [10, 32, 4, 6, "s"], [10, 28, 4, 4, "h"]]),
  };

  const armR = {
    back: mkR([[44, 36, 5, 4, "s"], [47, 40, 4, 5, "s"], [49, 44, 4, 4, "h"]]),
    down: mkR([[44, 36, 4, 8, "s"], ...cR, [44, 44, 4, 4, "h"]]),
    lowOut: mkR([[44, 36, 5, 4, "s"], [47, 39, 5, 4, "s"], [50, 42, 4, 4, "h"]]),
    mid: mkR([[44, 36, 8, 4, "s"], [52, 36, 4, 4, "h"]]),
    highOut: mkR([[44, 34, 5, 4, "s"], [48, 30, 4, 5, "s"], [51, 27, 4, 4, "h"]]),
    up: mkR([[44, 34, 6, 4, "s"], [48, 28, 4, 6, "s"], [48, 24, 4, 4, "h"]]),
    forwardLow: mkR([[44, 36, 4, 5, "s"], [42, 40, 4, 4, "s"], [40, 43, 4, 4, "h"]]),
    forward: mkR([[44, 36, 4, 6, "s"], [40, 40, 6, 4, "s"], [38, 41, 4, 4, "h"]]),
    forwardHigh: mkR([[44, 36, 4, 5, "s"], [41, 37, 5, 4, "s"], [39, 35, 4, 4, "h"]]),
    flex: mkR([[44, 36, 6, 4, "s"], [50, 32, 4, 6, "s"], [50, 28, 4, 4, "h"]]),
    salute: mkR([[44, 36, 6, 4, "s"], [48, 28, 4, 8, "s"], [44, 22, 6, 6, "h"]]),
  };

  return { armL, armR };
}

/** Build 8 articulated 64×64 leg+boot variants per side (with intermediate halfStep/halfWide/halfCrouch). */
function buildLegParts({ legs = "pants", boots = "dark", pants = "N", pantsHi = "n" } = {}) {
  const bMain = boots === "white" ? "W" : boots === "brown" ? "B" : boots === "space" ? "W" : "g";
  const bSole = boots === "white" ? "w" : boots === "space" ? "g" : "O";
  const drawLeg = (g, x, y, h, footDx, isLeft) => {
    if (legs === "shorts") {
      fill(g, x, y, 8, 2, pants);
      fill(g, x, y + 2, 8, Math.max(2, h - 2), isLeft ? "S" : "s");
    } else {
      fill(g, x, y, 8, h, pants);
      if (isLeft) fill(g, x, y, 4, h, pantsHi);
    }
    fill(g, x + footDx, y + h, 8, 2, bMain);
    fill(g, x + footDx + (isLeft ? -2 : 0), y + h + 2, 10, 2, bSole);
  };
  const mk = (fn) => { const g = blank(); fn(g); return g; };
  const legL = {
    stand: mk((g) => drawLeg(g, 22, 50, 4, 0, true)),
    halfStep: mk((g) => drawLeg(g, 21, 49, 3, -1, true)),
    step: mk((g) => drawLeg(g, 20, 48, 2, -2, true)),
    kick: mk((g) => drawLeg(g, 16, 47, 2, -2, true)),
    halfWide: mk((g) => drawLeg(g, 20, 50, 4, -1, true)),
    wide: mk((g) => drawLeg(g, 18, 50, 4, -2, true)),
    halfCrouch: mk((g) => drawLeg(g, 21, 51, 3, 0, true)),
    crouch: mk((g) => drawLeg(g, 20, 52, 2, 0, true)),
  };
  const legR = {
    stand: mk((g) => drawLeg(g, 34, 50, 4, 0, false)),
    halfStep: mk((g) => drawLeg(g, 35, 49, 3, 1, false)),
    step: mk((g) => drawLeg(g, 36, 48, 2, 2, false)),
    kick: mk((g) => drawLeg(g, 40, 47, 2, 2, false)),
    halfWide: mk((g) => drawLeg(g, 36, 50, 4, 1, false)),
    wide: mk((g) => drawLeg(g, 38, 50, 4, 2, false)),
    halfCrouch: mk((g) => drawLeg(g, 35, 51, 3, 0, false)),
    crouch: mk((g) => drawLeg(g, 36, 52, 2, 0, false)),
  };
  return { legL, legR };
}

/** Build a complete 7-part native 64×64 multi-angle (front / side / back) skeletal rig for a citizen. */
function buildCharacterRig(spec) {
  const sleeveMap = {
    hoodie: ["A", "d"], labcoat: ["W", "w"], chef: ["W", "w"], apron: ["W", "w"],
    cafe: ["W", "w"], trench: ["b", "B"], fire: ["A", "d"], vest: ["W", "w"],
    overalls: ["W", "w"], robe: ["A", "d"], jersey: ["S", "s"], pilot: ["A", "d"],
    ninja: ["N", "O"], spacesuit: ["W", "w"], jacket: ["A", "d"],
  };
  const [sleeveL, sleeveR] = spec.sleeves || sleeveMap[spec.coat || "hoodie"] || ["A", "d"];
  const cuff = spec.coat === "fire" || spec.coat === "pilot" ? "Y" : null;
  const hand = spec.coat === "spacesuit" ? "W" : "S";
  const armOpts = { sleeveL, sleeveR, hand, cuff };
  const legOpts = {
    legs: spec.legs || "pants",
    boots: spec.boots || (spec.coat === "spacesuit" ? "space" : "dark"),
    pants: spec.coat === "spacesuit" ? "W" : "N",
    pantsHi: spec.coat === "spacesuit" ? "W" : "n",
  };

  // Front-facing 7 parts
  const head = buildHeadParts(spec);
  const torso = buildTorsoParts(spec.coat, spec.extraTorso);
  const { armL, armR } = buildArmParts(armOpts);
  const { legL, legR } = buildLegParts(legOpts);
  const angleProps = buildAngleProps(spec.props || {}, spec.sideProps || {}, spec.backProps || {});
  const prop = angleProps.front;

  // Side-profile & Rear-view 7 parts (guaranteeing full variant parity with front)
  const sideHead = buildSideHeadParts(spec);
  const backHead = buildBackHeadParts(spec);
  for (const key of Object.keys(head)) {
    if (!sideHead[key]) sideHead[key] = clone(sideHead.normal);
    if (!backHead[key]) backHead[key] = clone(backHead.normal);
  }
  const sideTorso = buildSideTorsoParts(spec.coat, spec.torsoDetail);
  const backTorso = buildBackTorsoParts(spec.coat, spec.torsoDetail);
  const { armL: sideArmL, armR: sideArmR } = buildSideArmParts(armOpts);
  const { armL: backArmL, armR: backArmR } = buildBackArmParts(armOpts);
  const { legL: sideLegL, legR: sideLegR } = buildSideLegParts(legOpts);
  const { legL: backLegL, legR: backLegR } = buildBackLegParts(legOpts);

  const front = { head, torso, armL, armR, legL, legR, prop };
  const side = { head: sideHead, torso: sideTorso, armL: sideArmL, armR: sideArmR, legL: sideLegL, legR: sideLegR, prop: angleProps.side };
  const back = { head: backHead, torso: backTorso, armL: backArmL, armR: backArmR, legL: backLegL, legR: backLegR, prop: angleProps.back };

  return { head, torso, armL, armR, legL, legR, prop, angles: { front, side, back } };
}

// ============================================================================
// Keyframe Normalization & Smooth Joint-Arc Interpolation (12–20 Frames/Clip)
// ============================================================================

const DEFAULT_PART_VARIANTS = {
  head: "normal", torso: "normal", armL: "down", armR: "down", legL: "stand", legR: "stand", prop: "default",
};

function normPart(partName, input, defaultVisible = true) {
  if (input === false || input === null) {
    return { dx: 0, dy: 0, variant: DEFAULT_PART_VARIANTS[partName], flip: false, visible: false };
  }
  if (typeof input === "string") {
    return { dx: 0, dy: 0, variant: input, flip: false, visible: true };
  }
  const obj = input || {};
  return {
    dx: obj.dx ?? 0,
    dy: obj.dy ?? 0,
    variant: obj.variant ?? DEFAULT_PART_VARIANTS[partName],
    flip: !!obj.flip,
    visible: obj.visible ?? defaultVisible,
  };
}

const VALID_ANGLES = new Set(RIG_ANGLES);
const EXPLICIT_ANGLE = new WeakSet();
const EXPLICIT_FACING = new WeakSet();

/**
 * Create one normalized 64×64 skeletal keyframe covering all 7 parts + perspective (`angle`, `facing`).
 * Note: `dx`/`dy` in `kf(...)` are accepted in 32-unit convenience coordinates (auto-scaled ×2 to 64×64)
 * unless `extras.native64 === true`, so hand-authored beats & interpolated sub-steps align cleanly!
 */
function kf(parts = {}, extras = {}) {
  const s = extras.native64 ? 1 : 2;
  const scalePart = (name, val) => {
    const p = normPart(name, val);
    return { dx: Math.round(p.dx * s), dy: Math.round(p.dy * s), variant: p.variant, flip: p.flip, visible: p.visible };
  };
  const angle = VALID_ANGLES.has(extras.angle) ? extras.angle : "front";
  const facing = extras.facing === "left" ? "left" : "right";
  const frame = {
    head: scalePart("head", parts.head),
    torso: scalePart("torso", parts.torso),
    armL: scalePart("armL", parts.armL),
    armR: scalePart("armR", parts.armR),
    legL: scalePart("legL", parts.legL),
    legR: scalePart("legR", parts.legR),
    prop: scalePart("prop", parts.prop),
    angle,
    facing,
    shadow: extras.shadow ?? "keep",
    propZ: extras.propZ ?? "front",
  };
  if (extras.angle !== undefined) EXPLICIT_ANGLE.add(frame);
  if (extras.facing !== undefined) EXPLICIT_FACING.add(frame);
  if (extras.fx) {
    frame.fx = extras.native64 ? extras.fx : extras.fx.map(([ox, oy, lines]) => [ox * 2, oy * 2, lines, true]);
  }
  if (extras.afterimage) {
    const list = Array.isArray(extras.afterimage) ? extras.afterimage : [extras.afterimage];
    frame.afterimage = list.map((a) => ({ dx: Math.round((a.dx ?? 0) * s), dy: Math.round((a.dy ?? 0) * s), tint: a.tint ?? "c" }));
  }
  if (extras.petrify) frame.petrify = true;
  if (extras.scale) frame.scale = extras.scale;
  return frame;
}

// Anatomical joint-arc transition graphs (BFS shortest path between any two limb variants!)
const ARM_GRAPH = {
  back: ["down"],
  down: ["back", "lowOut", "forwardLow"],
  lowOut: ["down", "mid"],
  mid: ["lowOut", "highOut", "flex", "forward"],
  highOut: ["mid", "up", "forwardHigh"],
  up: ["highOut", "salute"],
  forwardLow: ["down", "forward"],
  forward: ["forwardLow", "forwardHigh", "mid"],
  forwardHigh: ["forward", "highOut", "salute"],
  flex: ["mid", "highOut"],
  salute: ["forwardHigh", "up"],
};

const LEG_GRAPH = {
  stand: ["halfStep", "halfWide", "halfCrouch"],
  halfStep: ["stand", "step"],
  step: ["halfStep", "kick"],
  kick: ["step"],
  halfWide: ["stand", "wide", "halfCrouch"],
  wide: ["halfWide", "crouch"],
  halfCrouch: ["stand", "crouch", "halfWide"],
  crouch: ["halfCrouch", "wide"],
};

const TORSO_GRAPH = {
  leanL: ["leanL1"],
  leanL1: ["leanL", "normal"],
  normal: ["leanL1", "leanR1"],
  leanR1: ["normal", "leanR"],
  leanR: ["leanR1"],
};

const pathCache = new Map();

function shortestArc(graph, from, to) {
  if (from === to || !graph[from] || !graph[to]) return [from, to];
  const key = `${from}>${to}`;
  if (pathCache.has(key)) return pathCache.get(key);
  const queue = [[from]], seen = new Set([from]);
  while (queue.length) {
    const path = queue.shift();
    const last = path[path.length - 1];
    if (last === to) { pathCache.set(key, path); return path; }
    for (const nxt of graph[last] || []) {
      if (!seen.has(nxt)) { seen.add(nxt); queue.push([...path, nxt]); }
    }
  }
  return [from, to];
}

function pickArcVariant(partName, fromV, toV, t) {
  if (fromV === toV) return fromV;
  const graph = partName === "armL" || partName === "armR" ? ARM_GRAPH
    : partName === "legL" || partName === "legR" ? LEG_GRAPH
    : partName === "torso" ? TORSO_GRAPH : null;
  if (!graph) return t < 0.55 ? fromV : toV;
  const path = shortestArc(graph, fromV, toV);
  const idx = Math.min(path.length - 1, Math.floor(t * path.length));
  return path[idx];
}

/** Smooth cubic ease-in-out for natural acceleration & deceleration across joint arcs. */
function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

/** Interpolate viewing perspective smoothly: 180° turns (front↔back) pass through side; left↔right side flips pass through front! */
function pickTurnAngle(a, b, t) {
  const aa = a.angle || "front", ba = b.angle || "front";
  const af = a.facing || "right", bf = b.facing || "right";
  if (aa === ba) {
    if (aa === "side" && af !== bf) {
      if (t >= 0.30 && t < 0.72) return { angle: "front", facing: "right" };
      return { angle: "side", facing: t < 0.5 ? af : bf };
    }
    return { angle: aa, facing: t < 0.5 ? af : bf };
  }
  if ((aa === "front" && ba === "back") || (aa === "back" && ba === "front")) {
    if (t < 0.30) return { angle: aa, facing: af };
    if (t < 0.72) return { angle: "side", facing: bf };
    return { angle: ba, facing: bf };
  }
  return { angle: t < 0.5 ? aa : ba, facing: t < 0.5 ? af : bf };
}

/** Create one interpolated intermediate 64×64 keyframe between keyframe `a` and keyframe `b` at progress `t ∈ (0, 1)`. */
function tweenKeyframe(a, b, t) {
  const e = easeInOut(t);
  const turn = pickTurnAngle(a, b, t);
  const out = {
    angle: turn.angle,
    facing: turn.facing,
    shadow: t < 0.5 ? a.shadow : b.shadow,
    propZ: t < 0.5 ? a.propZ : b.propZ,
  };
  for (const part of RIG_PARTS) {
    const pa = a[part], pb = b[part];
    const visible = pa.visible && pb.visible ? true : (t < 0.5 ? pa.visible : pb.visible);
    const variant = !visible
      ? (t < 0.5 ? pa.variant : pb.variant)
      : (!pa.visible ? pb.variant : !pb.visible ? pa.variant : pickArcVariant(part, pa.variant, pb.variant, t));
    out[part] = {
      dx: Math.round(pa.dx + (pb.dx - pa.dx) * e),
      dy: Math.round(pa.dy + (pb.dy - pa.dy) * e),
      variant,
      flip: t < 0.5 ? pa.flip : pb.flip,
      visible,
    };
  }
  if (a.petrify && b.petrify) out.petrify = true;
  else if (a.petrify || b.petrify) out.petrify = t < 0.5 ? !!a.petrify : !!b.petrify;
  if (a.scale || b.scale) {
    const sa = a.scale ?? 1, sb = b.scale ?? 1;
    const sc = sa + (sb - sa) * e;
    if (sc < 0.98) out.scale = Math.round(sc * 100) / 100;
  }
  // Interpolate articulated afterimages smoothly too!
  if (a.afterimage || b.afterimage) {
    const src = t < 0.5 ? (a.afterimage || b.afterimage) : (b.afterimage || a.afterimage);
    const scaleA = a.afterimage && b.afterimage ? 1 : (t < 0.5 ? 0.7 : 0.85);
    out.afterimage = src.map((g) => ({ dx: Math.round(g.dx * scaleA), dy: Math.round(g.dy * scaleA), tint: g.tint }));
  }
  // Carry luminous FX with gentle sinusoidal shimmer across multi-frame transitions!
  const fxSrc = t < 0.5 ? a.fx : b.fx;
  if (fxSrc) {
    const driftY = Math.round(Math.sin(t * Math.PI * 2) * -1.4);
    out.fx = fxSrc.map(([ox, oy, lines, is2x]) => [ox, oy + driftY, lines, is2x]);
  }
  return out;
}

/**
 * Expand a rich multi-beat story (6–8 story beats) into a crisp, natural-speed **20–30 frame / 3–6s** clip!
 * Automatically inserts:
 *   - Smooth anatomical joint-arc transitions (`lowOut`/`highOut`, `halfStep`/`halfWide`, `leanL1`/`leanR1`)
 *   - Extra transition frames on multi-angle 3D turns (`front ↔ side ↔ back`, `left ↔ right`)
 *   - Natural pixel-art pacing (crisp ~100–145ms transitions, expressive ~140–270ms story beats — never slow-motion!)
 */
function clip(id, name, beatDurations, beats, options = {}) {
  if (beats.length < 4) throw Error(`Clip ${id} needs at least 4 story beats`);
  if (beatDurations.length !== beats.length) throw Error(`Clip ${id} durations length mismatch`);

  // Apply clip-level default angle / facing to any beats that didn't explicitly override them
  const defaultAngle = VALID_ANGLES.has(options.angle) ? options.angle : null;
  const defaultFacing = options.facing === "left" || options.facing === "right" ? options.facing : null;
  const resolvedBeats = (defaultAngle || defaultFacing)
    ? beats.map((b) => ({
      ...b,
      angle: EXPLICIT_ANGLE.has(b) ? b.angle : (defaultAngle ?? b.angle),
      facing: EXPLICIT_FACING.has(b) ? b.facing : (defaultFacing ?? b.facing),
    }))
    : beats;

  // Target 22–30 smooth keyframes naturally proportional to the number of story beats (6→24f, 7→27f, 8→30f)
  const segments = resolvedBeats.length;
  const defaultFrames = segments <= 5 ? 22 : segments === 6 ? 24 : segments === 7 ? 27 : 30;
  const desired = options.targetFrames ?? defaultFrames;
  const totalInBetweens = Math.max(20 - segments, Math.min(30 - segments, desired - segments));

  // Allocate extra transition frames to segments that rotate camera perspective (`angle`/`facing` turns)
  const segWeights = [];
  for (let i = 0; i < segments; i++) {
    const curr = resolvedBeats[i], next = resolvedBeats[(i + 1) % segments];
    const hasTurn = curr.angle !== next.angle || curr.facing !== next.facing;
    segWeights.push(1 + (hasTurn ? 0.45 : 0) + (i === segments - 1 ? 0.1 : 0));
  }
  const weightSum = segWeights.reduce((a, b) => a + b, 0);
  const segTweens = segWeights.map((w) => Math.max(2, Math.floor((w / weightSum) * totalInBetweens)));
  let diff = totalInBetweens - segTweens.reduce((a, b) => a + b, 0);
  for (let pass = 0; diff > 0; pass++) {
    const order = segWeights.map((w, idx) => ({ w, idx })).sort((a, b) => b.w - a.w);
    const pick = order[pass % order.length].idx;
    segTweens[pick]++;
    diff--;
  }
  while (diff < 0) {
    const idx = segTweens.findIndex((c) => c > 2);
    if (idx < 0) break;
    segTweens[idx]--;
    diff++;
  }

  // Natural crisp pixel-animation timing: anticipation & climax hold slightly longer, action hits stay snappy!
  const climaxIdx = segments >= 6 ? Math.floor(segments * 0.55) : Math.max(2, segments - 2);
  const keyframes = [];
  const rawDurations = [];

  for (let i = 0; i < segments; i++) {
    const curr = resolvedBeats[i];
    const next = resolvedBeats[(i + 1) % segments];
    const tweens = segTweens[i];
    const hasTurn = curr.angle !== next.angle || curr.facing !== next.facing;

    const phaseMul = i === 0 ? 1.24 : i === climaxIdx ? 1.32 : i === segments - 1 ? 1.20 : 1.04;
    const beatMs = Math.max(130, Math.min(275, Math.round(beatDurations[i] * phaseMul)));
    keyframes.push(curr);
    rawDurations.push(beatMs);

    // Crisp ~8–10 fps motion frames (never sluggish; slightly steadier on 3D perspective turns)
    const baseTweenMs = Math.max(95, Math.min(148, Math.round(beatDurations[i] * (hasTurn ? 0.78 : 0.70))));
    for (let step = 1; step <= tweens; step++) {
      const t = step / (tweens + 1);
      keyframes.push(tweenKeyframe(curr, next, t));
      rawDurations.push(baseTweenMs);
    }
  }

  // Soft bounds into 3.0–6.0s (3050–5850ms) preserving natural speed & per-clip tempo personality!
  const rawTotal = rawDurations.reduce((a, b) => a + b, 0);
  const scale = rawTotal < 3060 ? 3120 / rawTotal : rawTotal > 5850 ? 5800 / rawTotal : 1;
  const durations = rawDurations.map((ms) => Math.max(90, Math.min(300, Math.round(ms * scale))));

  if (keyframes.length < 20 || keyframes.length > 30) {
    throw Error(`Clip ${id} expanded to ${keyframes.length} frames, expected 20–30`);
  }
  return { id, name, durations, keyframes, beatCount: resolvedBeats.length };
}

// ============================================================================
// 64×64 Articulated Skeletal Compositor & SVG Path Compiler
// ============================================================================

const FORWARD_ARMS = new Set(["forward", "forwardLow", "forwardHigh"]);

/**
 * Compose a 64×64 pixel matrix from a character's 7-part multi-angle skeletal rig and one keyframe.
 * Supports front, side (with facing left/right flip), and back perspectives with angle-accurate Z-order,
 * delicate 1px 64×64 outlining, articulated afterimages, and crisp un-outlined FX.
 */
function composeKeyframe(rig, keyframe) {
  const angle = VALID_ANGLES.has(keyframe.angle) ? keyframe.angle : "front";
  const facingLeft = keyframe.facing === "left";
  const angleRig = (rig.angles && rig.angles[angle]) || rig;
  const body = blank();
  const draw = (partName) => {
    const t = keyframe[partName];
    if (!t || !t.visible) return;
    const dict = angleRig[partName] || rig[partName];
    if (!dict) return;
    const mat = dict[t.variant] || (partName !== "prop" ? dict[DEFAULT_PART_VARIANTS[partName]] : null);
    if (mat) blitPart(body, mat, t.dx, t.dy, !!t.flip !== facingLeft);
  };

  if (angle === "side") {
    // Side-profile 2.5D depth Z-order: back-prop → far armL → far legL → near legR → torso → head → near armR → front-prop
    if (keyframe.propZ === "back") draw("prop");
    draw("armL");
    draw("legL");
    draw("legR");
    draw("torso");
    draw("head");
    draw("armR");
    if (keyframe.propZ !== "back") draw("prop");
  } else if (angle === "back") {
    // Back-view Z-order: back-prop → forward arms (tucked behind chest!) → legs → torso → side/up arms → head (hair over shoulders!) → front-prop
    if (keyframe.propZ === "back") draw("prop");
    if (FORWARD_ARMS.has(keyframe.armL.variant)) draw("armL");
    if (FORWARD_ARMS.has(keyframe.armR.variant)) draw("armR");
    draw("legL");
    draw("legR");
    draw("torso");
    if (!FORWARD_ARMS.has(keyframe.armL.variant)) draw("armL");
    if (!FORWARD_ARMS.has(keyframe.armR.variant)) draw("armR");
    draw("head");
    if (keyframe.propZ !== "back") draw("prop");
  } else {
    // Front-view Z-order: back-prop → legs → torso → side/up/back arms → head → forward arms → front-prop
    if (keyframe.propZ === "back") draw("prop");
    draw("legL");
    draw("legR");
    draw("torso");
    if (!FORWARD_ARMS.has(keyframe.armL.variant)) draw("armL");
    if (!FORWARD_ARMS.has(keyframe.armR.variant)) draw("armR");
    draw("head");
    if (FORWARD_ARMS.has(keyframe.armL.variant)) draw("armL");
    if (FORWARD_ARMS.has(keyframe.armR.variant)) draw("armR");
    if (keyframe.propZ !== "back") draw("prop");
  }

  let processed = body;
  if (keyframe.petrify) processed = petrifyMatrix(processed);
  if (keyframe.scale && keyframe.scale < 1) processed = scaleMatrix(processed, keyframe.scale);

  const composed = outline(processed);

  if (keyframe.afterimage) {
    const list = Array.isArray(keyframe.afterimage) ? keyframe.afterimage : [keyframe.afterimage];
    for (const ghost of list) {
      blitAfterimage(composed, processed, ghost.dx ?? 0, ghost.dy ?? 0, ghost.tint ?? "c");
    }
  }

  // Tapered 64×64 pixel ground shadow across y=58..59 (slightly sleeker in side profile!)
  const sh = keyframe.shadow ?? "keep";
  const drawShadow = (x0, x1) => {
    for (let x = x0; x < x1; x++) if (composed[58][x] === ".") composed[58][x] = "Z";
    for (let x = x0 + 2; x < x1 - 2; x++) if (composed[59][x] === ".") composed[59][x] = "Z";
  };
  if (sh === "keep") drawShadow(angle === "side" ? 20 : 18, angle === "side" ? 44 : 46);
  else if (sh === "shrink") drawShadow(22, 42);
  else if (sh === "tiny") drawShadow(26, 38);

  // Un-outlined luminous FX particles
  if (keyframe.fx) {
    for (const item of keyframe.fx) {
      const [ox, oy, lines, is2x] = item;
      if (is2x) stamp2xAt64(composed, ox, oy, lines);
      else stamp(composed, ox, oy, lines);
    }
  }
  return composed;
}

/** Compile a 64×64 character matrix into compact horizontal-run SVG paths grouped by color. */
function compileGrid(matrix, paletteMap) {
  const n = matrix.length, runs = new Map();
  for (let y = 0; y < n; y++) {
    const row = matrix[y];
    let x = 0;
    while (x < n) {
      const ch = row[x];
      if (ch === "." || !paletteMap[ch]) { x++; continue; }
      let end = x + 1;
      while (end < n && row[end] === ch) end++;
      const fillColor = paletteMap[ch];
      const seg = `M${x} ${y}h${end - x}v1h${x - end}z`;
      const existing = runs.get(fillColor);
      if (existing) existing.push(seg);
      else runs.set(fillColor, [seg]);
      x = end;
    }
  }
  const layers = [];
  let index = 0;
  for (const [fillColor, segments] of runs) {
    layers.push({ key: `${index++}-${fillColor}`, fill: fillColor, d: segments.join("") });
  }
  return layers;
}

/** Build a sprite entry with native 64×64 skeletal `rig`, `idleKeyframe`, and 12–20 frame keyframe `animations`. */
function makeRiggedSprite({ id, name, gender, palette, rig, idleKeyframe, animations }) {
  const idle = idleKeyframe || kf({ prop: rig.prop.default ? "default" : false });
  return {
    id,
    name,
    gender,
    action: animations[0].name,
    actions: animations.map((a) => a.name),
    durations: animations[0].durations,
    rig,
    idleKeyframe: idle,
    animations,
    palette,
  };
}


// 64×64 Multi-Angle ("Pixel 3D" / 2.5D) Skeletal Part Builders: Side (Profile) & Back (Rear).
// Produces authentic directional 64×64 pixel-art parts with profile noses, side temple-arm glasses,
// depth-layered near/far limbs, rear hair/backpacks/hoods/straps, and directional 3D volume shading.


// ============================================================================
// Directional 3D Lighting Shift per Angle (front → side → back)
// ============================================================================

const SHADABLE_KEYS = ["A", "a", "d", "S", "s", "P", "m", "H", "h", "k", "N", "n", "B", "b", "K", "w", "G", "g"];

/**
 * Shift character material shading subtly by viewing angle to create 2.5D sculptural depth:
 *   - front: full key-light clarity
 *   - side:  slightly cooler/deeper midtones (-6%) while rim highlights & luminous FX stay crisp
 *   - back:  deeper back-lit shading (-12%) so turning away reads immediately as 3D volume
 */
function shadePaletteForAngle(paletteMap, angle = "front") {
  if (!angle || angle === "front") return paletteMap;
  const shift = angle === "side" ? -0.065 : angle === "back" ? -0.125 : 0;
  if (!shift) return paletteMap;
  const out = { ...paletteMap };
  for (const key of SHADABLE_KEYS) {
    const val = out[key];
    if (typeof val === "string" && /^#[0-9a-fA-F]{6}$/.test(val)) {
      // Keep specular hair/accent highlights slightly livelier in side view for directional rim light
      const kShift = angle === "side" && (key === "a" || key === "h") ? shift * 0.3 : shift;
      out[key] = shade(val, kShift);
    }
  }
  return out;
}

      "HHHHHHHHHHHHHHHHHH..",
    ]);
  } else if (hairStyle === "bun") {
    fill(g, 21, 6, 11, 7, "H");
    px(g, 21, 6, "."); px(g, 31, 6, "."); px(g, 21, 12, "."); px(g, 31, 12, ".");
    fill(g, 24, 7, 5, 2, "h");
    fill(g, 19, 13, 23, 7, "H"); fill(g, 21, 11, 19, 3, "H");
  } else if (hairStyle === "fluffy") {
    fill(g, 17, 12, 26, 8, "H"); fill(g, 20, 10, 21, 3, "H");
    px(g, 17, 12, "."); px(g, 42, 12, ".");
  } else {
    fill(g, 19, 13, 23, 7, "H"); fill(g, 21, 11, 20, 3, "H");
    px(g, 19, 13, "."); px(g, 41, 13, ".");
  }
  // Back-of-head hair mass + deep left-side shadow + front-top rim highlight + bangs
  fill(g, 19, 18, 10, 13, "H");
  fill(g, 19, 20, 5, 11, "k");
  fill(g, 29, 19, 3, 6, "H"); // sideburn in front of ear
  fill(g, 31, 13, 8, 2, "h"); // directional right-side crown highlight!
  fill(g, 33, 19, 9, 2, "k"); // front bangs
  // Side ear peeking neatly out from hair
  fill(g, 26, 24, 3, 5, "S");
  px(g, 26, 24, "s"); px(g, 27, 26, "s"); px(g, 27, 28, "s");

  // 4. Profile Eye, Glasses w/ Temple Arm, Blush & Side Mouth
  if (eyeStyle === "sparkle") {
    stamp(g, 36, 22, ["EEEE", "EEWW", "EEEW", "EWEE", "kEEk"]);
    fill(g, 33, 27, 4, 2, "P");
    stamp(g, 38, 29, ["...m", "mmm."]);
  } else if (eyeStyle === "crisp") {
    fill(g, 36, 20, 4, 1, "k");
    stamp(g, 36, 22, ["EEWW", "EEEW", "EEEE", "EkEE"]);
    stamp(g, 38, 29, ["mmm."]);
  } else if (eyeStyle === "glasses") {
    // Sleek temple arm from ear to front lens!
    fill(g, 27, 23, 9, 1, "O");
    stamp(g, 35, 21, [
      ".OOOOOO.",
      "OcEEWWcO",
      "OcEEEWcO",
      "OcEEEEcO",
      "OccEEccO",
      ".OOOOOO.",
    ]);
    stamp(g, 38, 29, ["mmm."]);
  } else if (eyeStyle === "goldglasses") {
    fill(g, 27, 23, 9, 1, "Y");
    stamp(g, 35, 21, [
      ".YYYYYY.",
      "YcEEWWcY",
      "YcEEEWcY",
      "YcEEEEcY",
      "YccEEccY",
      ".YYYYYY.",
    ]);
    fill(g, 33, 27, 4, 2, "P");
    stamp(g, 38, 29, ["...m", "mmm."]);
  } else if (eyeStyle === "shades") {
    fill(g, 27, 23, 9, 1, "O");
    stamp(g, 35, 21, [
      ".OOOOOOO",
      "OOOWgOOO",
      "OOWgOOOO",
      ".OOOOOO.",
      "..OOOO..",
    ]);
    fill(g, 33, 27, 3, 2, "P");
    stamp(g, 38, 29, ["mmm."]);
  }

  // 5. Side-profile beards
  if (spec.beardKind === "mustache") {
    stamp(g, 37, 27, [".HHHH.", "HHHHHH"]);
  } else if (spec.beardKind === "beard") {
    fill(g, 33, 29, 9, 5, "B");
    px(g, 41, 33, ".");
  }

  if (includeHat && spec.hatKind) drawHatByKind(g, spec.hatKind, "side");
  return g;
}

function buildSideHeadParts(spec) {
  const normal = drawSideHead64(spec, true);
  const mod = (fn) => { const c = clone(normal); fn(c); return c; };
  const hasGlasses = spec.eyeStyle === "glasses" || spec.eyeStyle === "goldglasses";
  const eyeFill = hasGlasses ? "c" : "S";
  const eyeH = hasGlasses ? 4 : 5;
  const clearEye = (g) => fill(g, 36, 22, 4, eyeH, eyeFill);

  const parts = {
    normal,
    blink: mod((g) => {
      if (spec.customKind === "astronaut") return;
      clearEye(g);
      fill(g, 36, 24, 4, 1, "k");
    }),
    happy: mod((g) => {
      if (spec.customKind === "astronaut") { fill(g, 36, 18, 6, 2, "W"); return; }
      clearEye(g);
      stamp(g, 36, 23, [".EE.", "E..E"]);
      if (spec.customKind !== "ninja") stamp(g, 37, 28, ["mmmm.", "mWWm.", ".mmm."]);
    }),
    glow: mod((g) => { fill(g, 36, 22, 4, 4, "Y"); px(g, 38, 23, "W"); }),
    glowF: mod((g) => {
      fill(g, 36, 22, 4, 4, "F"); px(g, 38, 23, "Y");
      if (spec.customKind !== "ninja" && spec.customKind !== "astronaut") stamp(g, 37, 28, [".RRRR", "RWWWR", ".RRRR"]);
    }),
    glowC: mod((g) => { fill(g, 36, 22, 4, 4, "C"); px(g, 38, 23, "W"); }),
    glowV: mod((g) => { fill(g, 36, 22, 4, 4, "V"); px(g, 38, 23, "W"); }),
    glowM: mod((g) => { fill(g, 36, 22, 4, 4, "M"); px(g, 38, 23, "W"); }),
    glowR: mod((g) => { fill(g, 36, 22, 4, 4, "R"); px(g, 38, 23, "Y"); }),
    shock: mod((g) => {
      if (spec.customKind === "astronaut") return;
      clearEye(g);
      stamp(g, 36, 22, ["WWWW", "WEEW", "WEEW", "WWWW"]);
      if (spec.customKind !== "ninja") stamp(g, 38, 28, [".OOO", "ORRO", "ORRO", ".OOO"]);
    }),
    dizzy: mod((g) => {
      if (spec.customKind === "astronaut") return;
      clearEye(g);
      stamp(g, 36, 22, ["E..E", ".EE.", ".EE.", "E..E"]);
      if (spec.customKind !== "ninja") stamp(g, 38, 29, ["m.mm"]);
    }),
    shout: mod((g) => {
      if (spec.customKind !== "ninja" && spec.customKind !== "astronaut") {
        stamp(g, 37, 28, [".RRRR", "RWWWR", "RRRRR", "..RRR"]);
      }
    }),
    flash: mod((g) => {
      // Dramatic anime side-profile white glint shooting right!
      fill(g, 33, 22, 13, 3, "W");
      fill(g, 35, 25, 11, 1, "c");
    }),
  };

  if (spec.hatFn || spec.hatKind) {
    parts.hatless = drawSideHead64(spec, false);
    parts.hatlessShock = (() => {
      const c = clone(parts.hatless);
      clearEye(c);
      stamp(c, 36, 22, ["WWWW", "WEEW", "WEEW", "WWWW"]);
      stamp(c, 38, 28, [".OOO", "ORRO", "ORRO", ".OOO"]);
      return c;
    })();
  }

  // Role-specific extraHead side variants so 100% of custom heads exist in side view!
  if (spec.id === "artist" || spec.extraHeadKinds?.includes("paint")) {
    parts.paint = mod((g) => {
      clearEye(g); stamp(g, 36, 22, ["E..E", ".EE.", ".EE.", "E..E"]);
      stamp2x(g, 15, 11, ["M.Y.", "..C.", "R..M"], false);
    });
  }
  if (spec.extraHeadKinds?.includes("scientist")) {
    parts.goggleFlash = mod((g) => { fill(g, 37, 12, 5, 5, "W"); fill(g, 42, 13, 3, 2, "W"); });
    const afro = mod((g) => {
      stamp2x(g, 7, 1, [
        "...OOOOOOOOOOO...",
        ".OOkOOOkOOOkOOOO.",
        "OOOOOkOOOOOkOOOOO",
        ".OOkOOOOOOOOOkOO.",
        "..OOOOOOOOOOOOO..",
      ]);
      clearEye(g); stamp(g, 36, 22, ["WWWW", "WEEW", "WEEW", "WWWW"]);
      stamp(g, 38, 28, [".OOO", "ORRO", "ORRO", ".OOO"]);
    });
    const afroDizzy = clone(afro);
    clearEye(afroDizzy); stamp(afroDizzy, 36, 22, ["E..E", ".EE.", ".EE.", "E..E"]);
    parts.afro = afro;
    parts.afroDizzy = afroDizzy;

  if (spec.customKind === "astronaut") {
    parts.sweep1 = mod((g) => { fill(g, 35, 14, 5, 3, "W"); fill(g, 34, 17, 5, 2, "C"); });
    parts.sweep2 = mod((g) => { fill(g, 38, 17, 5, 3, "W"); fill(g, 37, 20, 5, 2, "C"); });
    parts.visorHappy = mod((g) => { stamp(g, 36, 17, [".WW.", "W..W"]); });
  }
  if (spec.extraHeadKinds?.includes("disguise")) {
    parts.disguise = mod((g) => {
      fill(g, 27, 23, 9, 1, "O");
      stamp(g, 35, 21, [".OOOOOO", "OOWOOOO", ".OOOOO."]);
      stamp(g, 36, 27, [".KKKKKK", "KKkkkKK", ".KKKKK."]);
    });
  }
  if (spec.extraHeadKinds?.includes("oil")) {
    parts.oil = mod((g) => {
      fill(g, 32, 20, 10, 12, "O");
      stamp(g, 36, 22, ["WWWW", "WEEW", "WEEW", "WWWW"]);
    });
  }
  if (spec.extraHeadKinds?.includes("baker")) {
    parts.cream = mod((g) => { fill(g, 37, 26, 6, 3, "W"); });
    parts.sugar = mod((g) => {
      stamp2x(g, 9, 2, ["..WWWWWWWW..", ".WWWWWWWWWW.", "WWwWWWWWWwWW", ".WWWWWWWWWW."]);
      clearEye(g); stamp(g, 36, 22, ["WWWW", "WEEW", "WEEW", "WWWW"]);
    });
  }
  if (spec.customKind === "ninja") {
    parts.scarfUp = mod((g) => {
      stamp2x(g, 3, 7, ["aAAd...", "aA.....", "_______", "_______"]);
    });
    parts.glowRed = mod((g) => { fill(g, 36, 22, 4, 4, "R"); px(g, 38, 23, "Y"); });
  }
  return parts;
}

function drawBackHead64(spec, includeHat = true) {

  const g = blank();

      "..HH.....HHH...HH...",
      ".HHHH...HHHHH.HHHH..",
      "HHHHHHHHHHHHHHHHHHHH",

    fill(g, 26, 6, 12, 7, "H");
    px(g, 26, 6, "."); px(g, 37, 6, "."); px(g, 26, 12, "."); px(g, 37, 12, ".");
    fill(g, 28, 7, 6, 2, "h");
    fill(g, 27, 12, 10, 2, "A"); // hairband at base of bun
    fill(g, 19, 13, 26, 19, "H");
    fill(g, 19, 25, 26, 7, "k");
    fill(g, 24, 15, 16, 2, "h");
  } else if (hairStyle === "fluffy") {
    fill(g, 17, 12, 30, 20, "H"); fill(g, 20, 10, 24, 3, "H");
    px(g, 17, 12, "."); px(g, 46, 12, ".");
    fill(g, 17, 25, 30, 7, "k");
    fill(g, 22, 13, 20, 2, "h");
  } else if (hairStyle === "long") {
    fill(g, 17, 12, 30, 27, "H"); fill(g, 20, 10, 24, 3, "H");
    fill(g, 16, 20, 32, 18, "H");
    fill(g, 16, 32, 32, 8, "k");
    // Layered hair vertical shadow streaks for rich 64×64 hair craft
    fill(g, 23, 22, 2, 17, "k"); fill(g, 31, 20, 2, 19, "k"); fill(g, 39, 22, 2, 17, "k");
    fill(g, 23, 13, 18, 2, "h");
  } else if (hairStyle === "wavy") {
    fill(g, 16, 12, 32, 27, "H"); fill(g, 19, 10, 26, 3, "H");
    fill(g, 14, 22, 36, 15, "H");
    fill(g, 15, 33, 34, 7, "k");
    fill(g, 22, 22, 2, 16, "k"); fill(g, 31, 21, 2, 18, "k"); fill(g, 40, 22, 2, 16, "k");
    fill(g, 23, 13, 18, 2, "h");
  } else if (hairStyle === "bob") {
    fill(g, 17, 12, 30, 22, "H"); fill(g, 20, 10, 24, 3, "H");
    fill(g, 16, 20, 32, 13, "H");
    fill(g, 17, 29, 30, 5, "k");

    fill(g, 19, 12, 26, 19, "H"); fill(g, 21, 10, 22, 3, "H");

    fill(g, 24, 13, 16, 2, "h");

    fill(g, 28, 19, 8, 3, "A"); // bright hair tie
    fill(g, 27, 22, 10, 12, "H");
    fill(g, 28, 31, 8, 6, "k");
    fill(g, 29, 23, 3, 5, "h");
  } else {

    px(g, 19, 12, "."); px(g, 44, 12, ".");
    fill(g, 19, 25, 26, 6, "k");
    fill(g, 24, 13, 16, 2, "h");
  }

  if (includeHat && spec.hatKind) drawHatByKind(g, spec.hatKind, "back");
  return g;
}

function addLeanVariants(g) {
  const makeLean = (dir, mag) => {
    const out = blank();
    for (let y = 33; y <= 51; y++) {
      const shift = y <= 41 ? dir * mag : y <= 45 ? dir * Math.trunc(mag / 2) : 0;
      for (let x = 0; x < PIXEL_GRID_SIZE; x++) {
        if (g[y][x] !== ".") px(out, x + shift, y, g[y][x]);
      }
    }
    return out;
  };
  return { normal: g, leanL1: makeLean(-1, 1), leanL: makeLean(-1, 2), leanR1: makeLean(1, 1), leanR: makeLean(1, 2) };
}

function buildSideLegParts({ legs = "pants", boots = "dark", pants = "N", pantsHi = "n" } = {}) {
  const bMain = boots === "white" ? "W" : boots === "brown" ? "B" : boots === "space" ? "W" : "g";
  const bDark = boots === "white" ? "w" : boots === "brown" ? "K" : boots === "space" ? "w" : "O";
  const bSole = boots === "white" ? "w" : boots === "space" ? "g" : "O";

  const drawSideLeg = (g, x, y, h, isNear) => {
    const pCol = isNear ? pants : "O";
    if (legs === "shorts") {
      fill(g, x, y, 7, 2, pCol);
      fill(g, x, y + 2, 7, Math.max(2, h - 2), isNear ? "S" : "s");
    } else {
      fill(g, x, y, 7, h, pCol);
      if (isNear) fill(g, x + 4, y, 3, h, pantsHi); // front-facing shin highlight!
    }
    // Right-pointing boot silhouette (toe juts +3px forward to the right!)
    fill(g, x, y + h, 9, 2, isNear ? bMain : bDark);
    fill(g, x, y + h + 2, 10, 2, bSole);
  };
  const mk = (fn) => { const g = blank(); fn(g); return g; };

  // legL = FAR leg (steps forward-right); legR = NEAR leg (braces/pushes back-left) for true scissor stride!
  const legL = {
    stand: mk((g) => drawSideLeg(g, 30, 50, 4, false)),
    halfStep: mk((g) => drawSideLeg(g, 33, 49, 4, false)),
    step: mk((g) => drawSideLeg(g, 36, 48, 4, false)),
    kick: mk((g) => drawSideLeg(g, 39, 47, 3, false)),
    halfWide: mk((g) => drawSideLeg(g, 34, 50, 4, false)),
    wide: mk((g) => drawSideLeg(g, 37, 50, 4, false)),
    halfCrouch: mk((g) => drawSideLeg(g, 32, 51, 3, false)),
    crouch: mk((g) => drawSideLeg(g, 34, 52, 2, false)),
  };
  const legR = {
    stand: mk((g) => drawSideLeg(g, 26, 50, 4, true)),
    halfStep: mk((g) => drawSideLeg(g, 23, 49, 4, true)),
    step: mk((g) => drawSideLeg(g, 20, 49, 4, true)),
    kick: mk((g) => drawSideLeg(g, 17, 48, 3, true)),
    halfWide: mk((g) => drawSideLeg(g, 23, 50, 4, true)),
    wide: mk((g) => drawSideLeg(g, 20, 50, 4, true)),
    halfCrouch: mk((g) => drawSideLeg(g, 25, 51, 3, true)),
    crouch: mk((g) => drawSideLeg(g, 23, 52, 2, true)),
  };
  return { legL, legR };
}

function buildBackLegParts({ legs = "pants", boots = "dark", pants = "N", pantsHi = "n" } = {}) {

  const mk = (fn) => { const g = blank(); fn(g); return g; };

  return { legL, legR };

// ============================================================================
// Multi-Angle Prop Adapter (Preserves Front Props + Adds Side/Back Overrides)
// ============================================================================

function shiftMatrixX(src, dx) {
  if (!dx) return clone(src);
  const n = src.length, out = blank(n);
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const ch = src[y][x];
      if (ch !== "." && x + dx >= 0 && x + dx < n) out[y][x + dx] = ch;
    }
  }
  return out;
}

/**
 * Build front / side / back prop dictionaries so every prop variant exists in all 3 views.
 * Center-held props automatically nudge slightly forward (+6px right) in side profile unless
 * an explicit hand-crafted `sideProps` or `backProps` override is supplied!
 */
function buildAngleProps(frontProps = {}, sideOverrides = {}, backOverrides = {}) {
  const side = {};
  const back = {};
  for (const [key, mat] of Object.entries(frontProps)) {
    if (sideOverrides[key]) {
      side[key] = sideOverrides[key];
    } else {
      // Detect center-chest props (centroid near x=32) vs right-hand props (x>40) and gently project forward in side view
      let sumX = 0, cnt = 0;
      for (let y = 0; y < PIXEL_GRID_SIZE; y++) {
        for (let x = 0; x < PIXEL_GRID_SIZE; x++) {
          if (mat[y][x] !== ".") { sumX += x; cnt++; }
        }
      }
      const cx = cnt ? sumX / cnt : 32;
      const autoShift = cx >= 22 && cx <= 40 ? 8 : 0;
      side[key] = shiftMatrixX(mat, autoShift);
    }
    back[key] = backOverrides[key] ? backOverrides[key] : clone(mat);
  }
  return { front: frontProps, side, back };
}
