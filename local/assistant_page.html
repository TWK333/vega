<!DOCTYPE html>
<html lang="zh-CN" class="bubble-mode">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vega 助理</title>
<style>
  /* 外观与 Nova 的 taskbar bubble 对齐：同一套语义色、同一套卡片/气泡/输入条几何。
     结构保留我们的两栏（左栏热心市民与群聊、右栏会话），配色与尺寸照 Nova。 */
  html.bubble-mode, html.bubble-mode body { margin: 0; background: transparent; overflow: hidden; height: 100%; }
  html.bubble-mode, html.bubble-mode * { box-sizing: border-box; }

  /* 跟随任务栏主题：默认深色，浅色任务栏时由脚本加 .light。--ink 是叠加色。 */
  html.bubble-mode {
    color-scheme: dark;
    --ink: 255 255 255;
    --fg: #f5f5f7;
    --fg-strong: #fff;
    --fg-body: #e5e5ea;
    --fg-2: #c7c7cc;
    --fg-3: #98989f;
    --fg-4: #6e6e73;
    --bg-top: #202128;
    --bg-bottom: #16171b;
    --surface: rgb(255 255 255 / 0.06);
    --brand: #91adff;
    --brand-fill: linear-gradient(135deg, #7c95ff 0%, #4f6fd8 100%);
    --shadow: 0 16px 40px rgba(0, 0, 0, 0.42), 0 2px 8px rgba(0, 0, 0, 0.28);
    --code-bg: rgba(0, 0, 0, 0.35);
    --field-bg: rgba(0, 0, 0, 0.3);
    --blue: #0a84ff;
    --link: #64d2ff;
    --orange: #ff9f0a;
    --on-orange: #1c1c1e;
    --green: #30d158;
    --red: #ff453a;
    --red-text: #ff6961;
    --gray: #8e8e93;
  }
  html.bubble-mode.light {
    color-scheme: light;
    --ink: 0 0 0;
    --fg: #1a1a1a;
    --fg-strong: #000;
    --fg-body: #2b2b2b;
    --fg-2: #424242;
    --fg-3: #616161;
    --fg-4: #8a8a8a;
    --bg-top: #f8f9fc;
    --bg-bottom: #f1f3f8;
    --surface: #fff;
    --brand: #4363c7;
    --brand-fill: linear-gradient(135deg, #6584f0 0%, #4363c7 100%);
    --shadow: 0 16px 40px rgba(30, 40, 80, 0.16), 0 2px 8px rgba(30, 40, 80, 0.08);
    --code-bg: rgba(0, 0, 0, 0.04);
    --field-bg: #fff;
    --blue: #005fb8;
    --link: #005fb8;
    --orange: #9d5d00;
    --on-orange: #fff;
    --green: #0f7b0f;
    --red: #c42b1c;
    --red-text: #c42b1c;
    --gray: #707070;
  }

  /* 不透明窗口，不留那圈 8px 透明边——卡片直接顶满窗口。 */
  .tb-shell { display: flex; flex-direction: column; height: 100vh; padding: 0; }
  /* 面板是普通窗口：页面铺满客户区，不再画气泡卡片那圈圆角/描边/阴影。 */
  .tb-card {
    --accent: var(--gray);
    position: relative; flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 10px;
    padding: 14px 16px 12px;
    border-radius: 0;
    color: var(--fg);
    font: 13px/1.55 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    background:
      radial-gradient(90% 40% at 100% 0%, color-mix(in srgb, var(--brand) 10%, transparent), transparent 70%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    border: 0;
    user-select: none; cursor: default;
  }
  .tb-card.running { --accent: var(--blue); }
  .tb-card.waiting { --accent: var(--orange); }
  .tb-card.done { --accent: var(--green); }
  .tb-card.error { --accent: var(--red); }

  .tb-head { display: flex; flex: none; align-items: center; gap: 8px; }
  .tb-fly { flex: none; overflow: visible; fill: var(--accent); }
  .tb-fly-body { fill: var(--fg); }
  .tb-wings { transform-box: fill-box; transform-origin: center; }
  .running .tb-wings { animation: tb-flap 0.6s ease-in-out infinite; }
  .waiting .tb-wings { animation: tb-flap 1.4s ease-in-out infinite; }
  @keyframes tb-flap { 50% { transform: scaleX(0.2); } }
  .tb-state { font-size: 13.5px; font-weight: 600; color: var(--fg-strong); letter-spacing: 0.01em; }
  .tb-time { font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
  .tb-head-text { min-width: 0; }
  .tb-head-text > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tb-close {
    margin-left: auto; display: grid; place-items: center;
    width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%;
    color: var(--fg-3); background: rgb(var(--ink) / 0.06); cursor: pointer;
    transition: background 120ms, color 120ms;
  }
  .tb-close:hover { background: rgb(var(--ink) / 0.14); color: var(--fg); }

  /* 两栏：左栏热心市民与群聊，右栏会话。 */
  .tb-panes { flex: 1; min-height: 0; display: flex; gap: 12px; }
  .tb-rail {
    flex: 0 0 172px; min-width: 0; display: flex; flex-direction: column;
    padding-right: 8px; border-right: 1px solid rgb(var(--ink) / 0.08);
  }
  .ta-section-title {
    display: flex; flex: none; align-items: center; justify-content: space-between; gap: 8px;
    padding: 0 2px 6px; font-size: 12px; font-weight: 600;
  }
  .ta-section-title > span { font-size: 10px; font-weight: 400; color: var(--fg-3); }
  .ta-session-list {
    min-height: 0; overflow-y: auto; overscroll-behavior: none;
    display: flex; flex-direction: column; gap: 5px; padding-right: 2px;
  }
  .ta-session-list.grow { flex: 1 1 auto; }
  .ta-session-list.short { flex: 0 1 auto; max-height: 34%; }
  .ta-session {
    flex: none; display: flex; flex-direction: column; gap: 2px; width: 100%;
    padding: 7px 10px; border: 1px solid rgb(var(--ink) / 0.06); border-radius: 10px;
    color: var(--fg); background: var(--surface); font: inherit; text-align: left; cursor: pointer;
    transition: border-color 120ms, background 120ms;
  }
  .ta-session:hover { border-color: color-mix(in srgb, var(--brand) 35%, transparent); }
  .ta-session.on { border-color: color-mix(in srgb, var(--brand) 55%, transparent); background: color-mix(in srgb, var(--brand) 10%, var(--surface)); }
  .ta-session-heading { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ta-session-heading strong { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; font-weight: 600; }
  /* 左栏卡片头像：22px 小圆角，执行任务的热心市民头像在左栏播放动画（driveAvatars 连左栏一起扫描；输入中不动）。 */
  .ta-session-face { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; color: #fff; background: var(--brand-fill); font-weight: 700; font-size: 10px; overflow: hidden; }
  .ta-session-face.bot { background: none; box-shadow: none; }
  .ta-session-face.bot .pixel-avatar { display: block; width: 100%; height: 100%; border-radius: inherit; image-rendering: pixelated; }
  .ta-status { flex: none; color: var(--fg-3); font-size: 10px; }
  .ta-status.running { color: var(--blue); }
  .ta-status.waiting { color: var(--orange); }
  .ta-status.done { color: var(--green); }
  .ta-status.error { color: var(--red-text); }
  .ta-session-text {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden;
    white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg-2); font-size: 11px; line-height: 1.5;
  }
  .ta-badge {
    flex: none; min-width: 16px; height: 16px; padding: 0 5px; border-radius: 8px;
    background: var(--brand); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center;
  }
  .ta-empty { padding: 6px 2px; color: var(--fg-3); font-size: 11px; }

  .tb-chat { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .ta-chat { position: relative; display: flex; flex: 1; min-height: 0; overflow: hidden; }
  .ta-history {
    flex: 1; min-width: 0; min-height: 0; overflow-y: auto; overflow-anchor: none;
    overscroll-behavior: none; padding: 4px 6px 4px 2px; outline-offset: -2px;
  }
  .ta-welcome { padding: 56px 12px; text-align: center; font-size: 15px; font-weight: 600; color: var(--fg); }
  .ta-welcome small { display: block; margin-top: 8px; font-size: 12px; font-weight: 400; color: var(--fg-3); }
  .ta-welcome code { padding: 1px 5px; border-radius: 4px; background: rgb(var(--ink) / 0.08); font-size: 11px; }
  /* 「新」分界：切进线程时上次看到的位置之后是新消息；来了新消息或切出再进来就不再出现。 */
  .ta-new { display: flex; align-items: center; gap: 10px; margin: 2px 0 12px; color: var(--brand); font-size: 11px; font-weight: 600; }
  .ta-new::before, .ta-new::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: 0.3; }
  /* 占位留着，收起时下面的内容不会跳。 */
  .ta-new.gone { visibility: hidden; }

  .ta-message { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 14px; }
  .ta-message.user { flex-direction: row-reverse; }
  .ta-avatar {
    flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px;
    color: #fff; background: var(--brand-fill); box-shadow: 0 2px 6px color-mix(in srgb, var(--brand) 30%, transparent);
    font-weight: 700; font-size: 12px; overflow: hidden;
  }
  /* 热心市民像素小人 SVG 头像：圆角底卡由 SVG 绘制，主体像素保持锐利。 */
  .ta-avatar.bot { background: none; box-shadow: none; }
  .ta-avatar.bot .pixel-avatar { display: block; width: 100%; height: 100%; border-radius: inherit; image-rendering: pixelated; }
  .ta-message.user .ta-avatar { display: none; }
  .ta-message-content { min-width: 0; max-width: calc(100% - 44px); }
  .ta-message.user .ta-message-content { max-width: 82%; }
  .ta-author { margin: 0 2px 4px; font-size: 11px; color: var(--fg-3); }
  .ta-bubble {
    position: relative; padding: 9px 13px; border: 1px solid rgb(var(--ink) / 0.06);
    border-radius: 4px 14px 14px 14px; white-space: pre-wrap; overflow-wrap: anywhere;
    user-select: text; line-height: 1.6; color: var(--fg-body); background: var(--surface);
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.04);
  }
  .ta-message.user .ta-bubble {
    border: 0; border-radius: 14px 4px 14px 14px; color: #fff; background: var(--brand-fill);
    box-shadow: 0 3px 10px color-mix(in srgb, var(--brand) 28%, transparent);
  }
  .ta-bubble.md { white-space: normal; }
  /* 待确认卡片本身是橙框，外层不再需要气泡底。 */
  .ta-bubble.ask { padding: 0; border: 0; background: transparent; box-shadow: none; }
  .ta-bubble.error { color: var(--red-text); border-color: color-mix(in srgb, var(--red) 40%, transparent); background: color-mix(in srgb, var(--red) 8%, var(--surface)); }
  .ta-bubble.progress { color: var(--fg-2); background: rgb(var(--ink) / 0.03); }
  .ta-bubble.typing { color: var(--fg-3); }
  .ta-message-meta { display: flex; align-items: center; gap: 10px; margin: 5px 0 0 2px; color: var(--fg-3); font-size: 11px; }
  .ta-message.user .ta-message-meta { justify-content: flex-end; }
  .ta-notice { display: flex; justify-content: center; margin: 0 0 14px; }
  .ta-notice span {
    padding: 3px 12px; border-radius: 999px; background: rgb(var(--ink) / 0.05);
    color: var(--fg-3); font-size: 11px;
  }
  .ta-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .ta-chip {
    display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px;
    border: 1px solid rgb(var(--ink) / 0.08); border-radius: 8px; background: rgb(var(--ink) / 0.04);
    color: var(--fg-2); font-size: 11px;
  }
  .ta-message.user .ta-chip { border-color: rgb(255 255 255 / 0.3); background: rgb(255 255 255 / 0.16); color: #fff; }
  .ta-step-output { display: grid; gap: 6px; margin-top: 6px; padding: 10px 12px; border: 1px solid rgb(var(--ink) / 0.1); border-radius: 12px; background: var(--surface); overflow-wrap: anywhere; }
  .ta-step-output strong { font-size: 12px; }
  .ta-step-output summary { color: var(--brand); cursor: pointer; font-size: 11px; }
  .ta-step-output .ta-md { margin-top: 8px; user-select: text; }
  .ta-step-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .ta-step-actions button { padding: 4px 8px; border: 1px solid rgb(var(--ink) / 0.1); border-radius: 8px; color: var(--fg); background: rgb(var(--ink) / 0.04); font: inherit; font-size: 11px; cursor: pointer; }
  .ta-step-actions button:disabled { opacity: .5; cursor: default; }

  /* markdown（与 Nova 的 .ta-md 同一套规则） */
  .ta-md > :first-child { margin-top: 0; }
  .ta-md > :last-child { margin-bottom: 0; }
  .ta-md :is(p, ul, ol, pre, blockquote, table) { margin: 0 0 8px; }
  .ta-md :is(ul, ol) { padding-left: 20px; }
  .ta-md li { margin: 2px 0; }
  .ta-md :is(h1, h2, h3, h4) { margin: 10px 0 6px; font-size: 1em; font-weight: 650; }
  .ta-md code { padding: 1px 4px; border-radius: 4px; font-size: 0.92em; background: rgb(var(--ink) / 0.06); }
  .ta-md pre { padding: 8px 10px; overflow-x: auto; border-radius: 8px; background: rgb(var(--ink) / 0.05); overscroll-behavior: none; }
  .ta-md pre code { padding: 0; background: none; }
  .ta-md a { color: var(--brand); text-decoration: none; }
  .ta-md a:hover { text-decoration: underline; }
  .ta-md blockquote { padding-left: 10px; border-left: 3px solid rgb(var(--ink) / 0.12); color: var(--fg-3); }
  .ta-md table { border-collapse: collapse; font-size: 0.92em; }
  .ta-md :is(th, td) { padding: 4px 8px; border: 1px solid rgb(var(--ink) / 0.1); }
  .ta-md img { max-width: 100%; border-radius: 8px; }
  .ta-md hr { border: 0; border-top: 1px solid rgb(var(--ink) / 0.1); margin: 10px 0; }

  /* 待确认气泡（Nova 的 tb-ask）：审批/提问直接坐在消息流里，不必再打字。 */
  .tb-ask {
    display: flex; flex-direction: column; gap: 8px; margin-top: 8px;
    padding: 10px 12px 12px; border-radius: 14px;
    background: color-mix(in srgb, var(--orange) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--orange) 28%, transparent);
  }
  .tb-ask-head { display: flex; align-items: center; gap: 8px; }
  .tb-ask-badge {
    padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    color: var(--on-orange); background: var(--orange);
  }
  .tb-ask-agent, .tb-ask-thread { font-size: 12px; color: var(--fg-3); overflow-wrap: anywhere; }
  .tb-ask-title { font-weight: 600; overflow-wrap: anywhere; }
  .tb-code {
    margin: 0; max-height: 120px; overflow: auto; padding: 8px 10px; border-radius: 10px;
    background: var(--code-bg); border: 1px solid rgb(var(--ink) / 0.06);
    font-family: "Cascadia Code", Consolas, "JetBrains Mono", monospace; font-size: 12px;
    white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg-body); user-select: text;
  }
  .tb-question { display: flex; flex-direction: column; gap: 6px; }
  .tb-question-head { font-size: 11px; font-weight: 600; color: var(--orange); text-transform: uppercase; letter-spacing: 0.04em; }
  .tb-input {
    padding: 7px 10px; border-radius: 10px; border: 1px solid rgb(var(--ink) / 0.12);
    background: var(--field-bg); color: var(--fg); font: inherit; outline: none; resize: none; user-select: text;
  }
  .tb-input:focus { border-color: var(--blue); }
  .tb-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .tb-btn {
    padding: 6px 14px; border: 0; border-radius: 9px; font: inherit; font-weight: 600;
    color: var(--fg); background: rgb(var(--ink) / 0.1); cursor: pointer;
    transition: filter 120ms, background 120ms, transform 80ms;
  }
  .tb-btn:hover { background: rgb(var(--ink) / 0.16); }
  .tb-btn:active { transform: scale(0.97); }
  .tb-btn.allow { background: var(--blue); color: #fff; }
  .tb-btn.allow:hover { filter: brightness(1.12); }
  .tb-btn.reject { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red-text); }
  .tb-btn.reject:hover { background: color-mix(in srgb, var(--red) 22%, transparent); }
  .tb-btn:disabled { opacity: 0.45; cursor: default; transform: none; }

  .ta-dots { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
  .ta-dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; animation: ta-dot 1.2s infinite ease-in-out; }
  .ta-dots i:nth-child(2) { animation-delay: 0.15s; }
  .ta-dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes ta-dot { 0%, 60%, 100% { opacity: 0.25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { .ta-dots i, .tb-wings { animation: none; } }

  .ta-latest {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    padding: 4px 12px; border: 1px solid rgb(var(--ink) / 0.1); border-radius: 999px;
    color: var(--brand); background: var(--surface); box-shadow: 0 4px 12px rgb(0 0 0 / 0.12);
    font: inherit; font-size: 11px; cursor: pointer; transition: opacity 120ms, transform 120ms;
  }
  .ta-latest[hidden] { display: none; }

  .ta-compose {
    position: relative; flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: end; gap: 2px 6px; padding: 5px;
    border: 1px solid rgb(var(--ink) / 0.1); border-radius: 14px; background: var(--surface);
    box-shadow: 0 2px 8px rgb(0 0 0 / 0.05);
  }
  .ta-input {
    width: 100%; min-height: 34px; max-height: 96px; padding: 6px 8px; border: 0; background: transparent;
    color: var(--fg); font: inherit; line-height: 1.5; resize: none; outline: none; user-select: text;
    field-sizing: content;
  }
  .ta-input::placeholder { color: var(--fg-4); }
  .ta-plus, .ta-submit {
    display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 10px;
    font: inherit; cursor: pointer; transition: filter 120ms, background 120ms, transform 80ms, opacity 120ms;
  }
  .ta-plus { color: var(--fg-3); background: transparent; font-size: 19px; line-height: 1; }
  .ta-plus:hover, .ta-plus.open { color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, transparent); }
  .ta-plus.open { transform: rotate(45deg); }
  .ta-submit { background: var(--brand-fill); color: #fff; font-size: 15px; }
  .ta-submit:hover { filter: brightness(1.08); }
  .ta-submit:active { transform: scale(0.95); }
  .ta-submit:disabled { opacity: 0.35; cursor: default; filter: none; transform: none; }
  .ta-error { grid-column: 1 / -1; padding: 0 8px 2px; color: var(--red-text); font-size: 10.5px; }
  .ta-error[hidden] { display: none; }
  .ta-menu {
    position: absolute; z-index: 5; left: 0; bottom: calc(100% + 6px); display: flex; flex-direction: column;
    min-width: 132px; padding: 4px; border: 1px solid rgb(var(--ink) / 0.1); border-radius: 12px;
    background: var(--bg-top); box-shadow: var(--shadow);
  }
  .ta-menu[hidden] { display: none; }
  .ta-menu > button {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 0; border-radius: 8px;
    color: var(--fg); background: transparent; font: inherit; text-align: left; cursor: pointer; white-space: nowrap;
  }
  .ta-menu > button:hover { background: color-mix(in srgb, var(--brand) 10%, transparent); }

  /* 滚动条也照 Nova：6px，只限定卡片内（Nova 是 .tb-card ::-webkit-scrollbar）。 */
  .tb-card ::-webkit-scrollbar { width: 6px; height: 6px; }
  .tb-card ::-webkit-scrollbar-thumb { border-radius: 3px; background: rgb(var(--ink) / 0.16); }
  .tb-card ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="tb-shell">
  <div class="tb-card" id="card">
    <div class="tb-head">
      <svg class="tb-fly" viewBox="-8 -7 16 13" width="16" height="13" aria-hidden="true">
        <g class="tb-wings">
          <path d="M0.5-0.5L1.8-4.4L4.4-6L7-5.2L7-2.6L0.5 0.6ZM0.5 0.6L4.6 1L5 3.4L2.8 5.2L0.5 2.8Z"/>
          <path d="M0.5-0.5L1.8-4.4L4.4-6L7-5.2L7-2.6L0.5 0.6ZM0.5 0.6L4.6 1L5 3.4L2.8 5.2L0.5 2.8Z" transform="scale(-1 1)"/>
        </g>
        <rect class="tb-fly-body" x="-0.9" y="-4.6" width="1.8" height="9.2" rx="0.9"/>
      </svg>
      <div class="tb-head-text">
        <div class="tb-state" id="who">Vega 助理</div>
        <div class="tb-time" id="sub">选择一位热心市民或一个群聊</div>
      </div>
      <button class="tb-close" id="settings" title="设置">⚙</button>
      <button class="tb-close" id="close" title="收起">×</button>
    </div>

    <div class="tb-panes">
      <aside class="tb-rail">

<script>
/* 热心市民像素小人头像：与 web/src/pixel-avatar.js（32×32 + 每职业 5 组独立动画）、shared/employee-avatars.ts 同步，暴露 window.PixelAvatar。 */
(function () {
// Pixel citizen avatars: 20 refined 32×32 pixel-art characters spanning diverse genders and professions.
// Each profession ships 5 independent exaggerated gag/shonen-style occupation animations (100 clips total, 4-6 frames each)
// randomly selected and played while the citizen is running a task.

const PIXEL_GRID_SIZE = 32;

/** Mix a #rrggbb color toward white (amount > 0) or black (amount < 0). */
function shade(hex, amount) {
  const clean = /^#[0-9a-fA-F]{6}$/.test(hex || "") ? hex : "#3878fb";
  const n = parseInt(clean.slice(1), 16), t = amount < 0 ? 0 : 255, k = Math.abs(amount);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.round(v + (t - v) * k));
  return "#" + c.map((v) => v.toString(16).padStart(2, "0")).join("");
}

// ============================================================================
// 32×32 Pixel Grid Primitives & Composition Helpers
// ============================================================================

function blank() {
  return Array.from({ length: PIXEL_GRID_SIZE }, () => Array(PIXEL_GRID_SIZE).fill("."));
}

function clone(src) {
  return src.map((row) => [...row]);
}

function px(g, x, y, ch) {
  if (x >= 0 && x < PIXEL_GRID_SIZE && y >= 0 && y < PIXEL_GRID_SIZE) g[y][x] = ch;
  return g;
}

function fill(g, x, y, w, h, ch) {
  for (let r = y; r < y + h; r++) {
    if (r < 0 || r >= PIXEL_GRID_SIZE) continue;
    for (let c = x; c < x + w; c++) {
      if (c >= 0 && c < PIXEL_GRID_SIZE) g[r][c] = ch;
    }
  }
  return g;
}

/** Stamp an ASCII art patch at (ox, oy). `.` keeps existing pixel, `_` erases to transparent. */
function stamp(target, ox, oy, lines) {
  for (let r = 0; r < lines.length; r++) {
    const y = oy + r;
    if (y < 0 || y >= PIXEL_GRID_SIZE) continue;
    const row = lines[r];
    for (let c = 0; c < row.length; c++) {
      const x = ox + c;
      if (x < 0 || x >= PIXEL_GRID_SIZE) continue;
      const ch = row[c];
      if (ch === ".") continue;
      target[y][x] = ch === "_" ? "." : ch;
    }
  }
  return target;
}

/** Shift all body pixels (excluding ground shadow `Z`) by (dx, dy) and re-draw ground shadow. */
function shiftBody(src, dx, dy, shadowMode = "keep") {
  const out = blank();
  for (let y = 0; y < PIXEL_GRID_SIZE; y++) {
    for (let x = 0; x < PIXEL_GRID_SIZE; x++) {
      const ch = src[y][x];
      if (ch === "." || ch === "Z") continue;
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < PIXEL_GRID_SIZE && ny >= 0 && ny < PIXEL_GRID_SIZE) out[ny][nx] = ch;
    }
  }
  if (shadowMode === "keep") fill(out, 9, 29, 14, 1, "Z");
  else if (shadowMode === "shrink") fill(out, 11, 29, 10, 1, "Z");
  else if (shadowMode === "tiny") fill(out, 13, 29, 6, 1, "Z");
  return out;
}

/** Add a crisp 1px dark-ink silhouette outline around solid body/prop pixels (skipping shadow `Z`). */
function outline(src, ch = "O") {
  const out = clone(src);
  const solid = (x, y) => {
    if (x < 0 || x >= PIXEL_GRID_SIZE || y < 0 || y >= PIXEL_GRID_SIZE) return false;
    const c = src[y][x];
    return c !== "." && c !== "Z" && c !== ch;
  };
  for (let y = 0; y < PIXEL_GRID_SIZE; y++) {
    for (let x = 0; x < PIXEL_GRID_SIZE; x++) {
      if (src[y][x] !== ".") continue;
      if (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1)) out[y][x] = ch;
    }
  }
  return out;
}

/** Finalize a character pose: outline the body first, then run optional luminous FX decorator(s) un-outlined. */
function finalize(body, fxFn, shadowMode = "keep") {
  const outlined = outline(body);
  if (shadowMode === "keep") {
    for (let x = 9; x < 23; x++) if (outlined[29][x] === ".") outlined[29][x] = "Z";
  } else if (shadowMode === "shrink") {
    for (let x = 11; x < 21; x++) if (outlined[29][x] === ".") outlined[29][x] = "Z";
  } else if (shadowMode === "tiny") {
    for (let x = 13; x < 19; x++) if (outlined[29][x] === ".") outlined[29][x] = "Z";
  }
  if (fxFn) fxFn(outlined);
  return outlined;
}

/** Render a translucent/tinted silhouette afterimage of `src` shifted by (dx, dy) BEHIND `target`. */
function withAfterimage(target, src, dx, dy, tint = "c") {
  const out = clone(target);
  for (let y = 0; y < PIXEL_GRID_SIZE; y++) {
    for (let x = 0; x < PIXEL_GRID_SIZE; x++) {
      const ch = src[y][x];
      if (ch === "." || ch === "Z") continue;
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < PIXEL_GRID_SIZE && ny >= 0 && ny < PIXEL_GRID_SIZE && out[ny][nx] === ".") {
        out[ny][nx] = tint;
      }
    }
  }
  return out;
}

/** Gintama-style petrified grayscale despair filter (for BSOD / shock). */
function petrify(src) {
  const map = { S: "w", s: "G", P: "w", m: "g", A: "G", a: "w", d: "g", H: "g", h: "G", k: "O", N: "g", B: "g", b: "G", R: "g", Y: "w", F: "G", C: "w", V: "G", M: "G", U: "g" };
  return src.map((row) => row.map((c) => map[c] || c));
}

/** Shrink a character sprite into an adorable mini-chibi anchored on the ground (for scientist shrink gag). */
function miniChibi(src) {
  const out = blank();
  for (let y = 0; y < 16; y++) {
    for (let x = 0; x < 16; x++) {
      const c = src[y * 2]?.[x * 2];
      if (c && c !== "." && c !== "Z") out[y + 13][x + 8] = c;
    }
  }
  return out;
}

// Expressive 32×32 face modifiers (eyes live at x=11..12 & x=19..20, y=11..13; mouth at x=15..16, y=14..15)
function eyesBlink(g, y = 11) {
  stamp(g, 11, y, ["SS", "kk", "SS"]);
  stamp(g, 19, y, ["SS", "kk", "SS"]);
  return g;
}
function eyesHappy(g, y = 11) {
  stamp(g, 11, y, ["EE", "SS", "SS"]);
  stamp(g, 19, y, ["EE", "SS", "SS"]);
  stamp(g, 15, 14, ["mm", "WW"]);
  return g;
}
function eyesGlow(g, ch = "Y", y = 11) {
  stamp(g, 11, y, [ch + ch, ch + ch]);
  stamp(g, 19, y, [ch + ch, ch + ch]);
  return g;
}
function eyesShock(g, y = 11) {
  stamp(g, 11, y, ["WW", "WE", "WW"]);
  stamp(g, 19, y, ["WW", "EW", "WW"]);
  stamp(g, 15, 14, ["OO", "RR"]);
  return g;
}
function eyesDizzy(g, y = 11) {
  stamp(g, 11, y, ["EW", "WE"]);
  stamp(g, 19, y, ["WE", "EW"]);
  stamp(g, 15, 14, ["mm", "SS"]);
  return g;
}
function glassesFlash(g, y = 11) {
  stamp(g, 10, y, ["WWWWWWWWWWWW", ".WWWWWWWWWW."]);
  return g;
}
function mouthShout(g) {
  stamp(g, 14, 14, [".RR.", "RWW."]);
  return g;
}
function stepFeet(g, side) {
  if (side === "left") {
    stamp(g, 11, 25, ["NNNN", "OOOO", "____", "____"]);
  } else if (side === "right") {
    stamp(g, 17, 25, ["NNNN", "OOOO", "____", "____"]);
  }
  return g;
}
function armsUp(g, armColor = "A") {
  // Erase side resting arms and draw raised cheering arms!
  stamp(g, 7, 18, ["___", "___", "___", "___", "___", "___"]);
  stamp(g, 22, 18, ["___", "___", "___", "___", "___", "___"]);
  stamp(g, 6, 13, ["SS", "SS", armColor + armColor, armColor + armColor, "." + armColor, "." + armColor]);
  stamp(g, 24, 13, ["SS", "SS", armColor + armColor, armColor + armColor, armColor + ".", armColor + "."]);
  return g;
}

/** Helper to define one occupation animation clip (4-6 frames). */
function clip(id, name, durations, frames) {
  if (frames.length < 4 || frames.length > 8) throw Error(`Clip ${id} expected 4-8 frames, got ${frames.length}`);
  if (durations.length !== frames.length) throw Error(`Clip ${id} durations length mismatch`);
  return { id, name, durations, frames };
}

// Curated diverse skin & rich 3-tone color palette
const SKIN = {
  fair: { S: "#fde4cf", s: "#e7b99a", P: "#f79ea4", m: "#c26c62" },
  peach: { S: "#fcd2ae", s: "#dfa179", P: "#f28f93", m: "#b86154" },
  warm: { S: "#f0bc90", s: "#cf8f62", P: "#e58178", m: "#a65446" },
  tan: { S: "#d69666", s: "#b17244", P: "#d17266", m: "#8c4438" },
  deep: { S: "#b27046", s: "#894d2b", P: "#b35e52", m: "#6a3124" },
};

const BASE_PALETTE = {
  O: "#1d2133", // deep navy-slate pixel ink outline
  E: "#141826", // crisp eye ink
  N: "#2c3954", // pants / dark navy
  n: "#415273", // pants highlight
  W: "#ffffff", // pure highlight white
  w: "#cbd5e1", // cool coat/steam shade
  G: "#94a3b8", // light steel / silver
  g: "#475569", // dark steel / charcoal
  B: "#7a472a", // rich wood / espresso / leather
  b: "#dba86c", // warm tan / straw / cardboard
  K: "#4e2d1a", // deep leather / dark wood
  R: "#ef4444", // vivid crimson
  r: "#b91c1c", // deep red
  Y: "#fbbf24", // bright gold
  y: "#fef08a", // pale glow yellow
  C: "#22d3ee", // bright cyan
  c: "#a5f3fc", // ice cyan
  V: "#22c55e", // vivid green
  v: "#15803d", // deep leaf green
  M: "#ec4899", // vivid pink / magenta

  u: "#d8b4fe", // soft lavender
  F: "#f97316", // blaze orange
  Z: "rgba(15, 23, 42, 0.14)",
};

function makePalette(skin, hair, extra = {}) {
  return (hex) => ({
    ...BASE_PALETTE,
    ...skin,
    ...hair,
    A: hex,
    a: shade(hex, 0.30),
    d: shade(hex, -0.32),
    ...extra,
  });
}

// ============================================================================
// Refined 32×32 Chibi Character Portrait Builder
// Produces rich 3-tone shaded head, distinct male/female hairstyles & eyes,
// detailed profession uniform, collar/accents, legs & shaded boots.
// ============================================================================

function buildChibi({ gender = "male", hairStyle = "short", eyeStyle, coat = "hoodie", legs = "pants", boots = "dark", extras } = {}) {
  const g = blank();
  const isF = gender === "female";

  // 1. Back hair layer for long / wavy / ponytail / bob female hairstyles
  if (hairStyle === "long") {
    fill(g, 8, 9, 16, 11, "H");
    fill(g, 8, 15, 2, 6, "k");
    fill(g, 22, 15, 2, 6, "k");
  } else if (hairStyle === "wavy") {
    fill(g, 7, 9, 18, 10, "H");
    stamp(g, 7, 17, ["HH..............HH", "kH..............Hk", ".k..............k."]);
  } else if (hairStyle === "ponytail") {
    stamp(g, 22, 9, ["HHH.", ".HHH", "..Hk", "..kk", "...k"]);
  } else if (hairStyle === "bob") {
    fill(g, 8, 9, 16, 9, "H");
    fill(g, 8, 16, 2, 2, "k");
    fill(g, 22, 16, 2, 2, "k");
  }

  // 2. Chibi Face (x=10..21, y=9..16) with soft chin shadow
  fill(g, 10, 9, 12, 7, "S");
  fill(g, 11, 16, 10, 1, "s");
  px(g, 10, 15, "s"); px(g, 21, 15, "s");
  // Subtle ears
  px(g, 9, 12, "S"); px(g, 9, 13, "s");
  px(g, 22, 12, "S"); px(g, 22, 13, "s");

  // 3. Hair Crown & Bangs (rich 3-tone H / h highlight / k shadow)
  if (hairStyle === "spiky") {
    stamp(g, 9, 5, [
      "...H...HH..H..",
      "..HHHHHHHHHH..",
      ".HHhhhHHhhhHH.",
      ".HHHHHHHHHHHH.",
      ".HkkHSSSSSkkH.",
      ".Hk........kH.",
    ]);
  } else if (hairStyle === "bun") {
    stamp(g, 12, 3, ["..HHHH..", ".HHhhHH.", ".HHHHHH."]);
    stamp(g, 9, 6, [
      "..HHHHHHHHHH..",
      ".HHhhHHHHhhHH.",
      ".HHHHHHHHHHHH.",
      ".HkkHHHHHHkkH.",
      ".Hk........kH.",
    ]);
  } else if (hairStyle === "fluffy") {
    stamp(g, 8, 5, [
      "...HHHHHHHHHH...",
      ".HHHhhhHHhhhHHH.",
      ".HHHHHHHHHHHHHH.",
      "HHkHHkHHHHkHHkHH",
      "Hk............kH",
    ]);
  } else if (hairStyle === "short" || hairStyle === "ponytail" || hairStyle === "long" || hairStyle === "wavy" || hairStyle === "bob") {
    stamp(g, 9, 6, [
      "..HHHHHHHHHH..",
      ".HHhhhHHhhhHH.",
      ".HHHHHHHHHHHH.",
      ".HkkHHkHHkHkH.",
      ".Hk........kH.",
    ]);
  } else if (hairStyle === "swept") {
    stamp(g, 9, 6, [
      "..HHHHHHHHHH..",
      ".HHhhhHHHHhHH.",
      ".HHHHHHHHHHHH.",
      ".HkkHHHHk...H.",
      ".Hk.........H.",
    ]);
  }

  // 4. Eyes, Brows, Blush & Smile
  const eStyle = eyeStyle || (isF ? "sparkle" : "crisp");
  if (eStyle === "sparkle") {
    stamp(g, 11, 11, ["WE", "EE", "kE"]);
    stamp(g, 19, 11, ["WE", "EE", "Ek"]);
    stamp(g, 10, 13, ["P", "P"]);
    stamp(g, 21, 13, ["P", "P"]);
    stamp(g, 15, 14, ["mm"]);
  } else if (eStyle === "crisp") {
    stamp(g, 11, 10, ["kk"]);
    stamp(g, 19, 10, ["kk"]);
    stamp(g, 11, 11, ["WE", "EE"]);
    stamp(g, 19, 11, ["WE", "EE"]);
    stamp(g, 15, 14, ["mm"]);
  } else if (eStyle === "glasses") {
    stamp(g, 10, 10, ["OOOO..OOOO"]);
    stamp(g, 10, 11, ["OWEOOOOWEO", "OEEO..OEEO", "OOOO..OOOO"]);
    stamp(g, 15, 14, ["mm"]);
  } else if (eStyle === "goldglasses") {
    stamp(g, 10, 10, ["YYYY..YYYY"]);
    stamp(g, 10, 11, ["YWEYYYYWEY", "YEEY..YEEY", "YYYY..YYYY"]);
    stamp(g, 10, 14, ["P"]); px(g, 21, 14, "P");
    stamp(g, 15, 14, ["mm"]);
  } else if (eStyle === "shades") {
    stamp(g, 10, 11, ["OOOO..OOOO", "OgOO..OOgO", ".OO....OO."]);
    stamp(g, 10, 14, ["P"]); px(g, 21, 14, "P");
    stamp(g, 15, 14, ["mm"]);
  }

  // 5. Neck & Collar
  fill(g, 14, 17, 4, 1, "s");

  // 6. Layered 3-Tone Occupation Torso (x=10..21, y=18..24) + Arms (x=8..9 & x=22..23)
  if (coat === "hoodie") {
    fill(g, 10, 18, 12, 7, "A");
    fill(g, 10, 18, 3, 2, "a");
    fill(g, 19, 20, 3, 5, "d");
    fill(g, 10, 24, 12, 1, "d");
    // Hoodie drawstrings + pocket
    px(g, 14, 19, "W"); px(g, 14, 20, "W"); px(g, 17, 19, "W"); px(g, 17, 20, "W");
    fill(g, 12, 22, 8, 2, "d"); fill(g, 13, 22, 6, 1, "A");
    // Arms
    fill(g, 8, 18, 2, 4, "A"); px(g, 8, 18, "a"); fill(g, 8, 22, 2, 2, "S");
    fill(g, 22, 18, 2, 4, "d"); fill(g, 22, 22, 2, 2, "S");
  } else if (coat === "labcoat") {
    fill(g, 10, 18, 12, 7, "W");
    fill(g, 13, 18, 6, 7, "A");

    px(g, 11, 21, "w"); px(g, 20, 21, "w"); // pockets
    fill(g, 8, 18, 2, 4, "W"); fill(g, 8, 22, 2, 2, "S");
    fill(g, 22, 18, 2, 4, "w"); fill(g, 22, 22, 2, 2, "S");

    stamp(g, 13, 17, ["aAAAAd", ".AAd.."]);
    px(g, 14, 20, "g"); px(g, 17, 20, "g"); px(g, 14, 22, "g"); px(g, 17, 22, "g");

    fill(g, 18, 20, 2, 5, "d");
    fill(g, 10, 23, 2, 2, "w"); fill(g, 20, 23, 2, 2, "w");
    fill(g, 8, 18, 2, 4, "W"); fill(g, 8, 22, 2, 2, "S");
    fill(g, 22, 18, 2, 4, "w"); fill(g, 22, 22, 2, 2, "S");
  } else if (coat === "cafe") {
    fill(g, 10, 18, 12, 7, "W");
    fill(g, 12, 19, 8, 6, "B");
    fill(g, 12, 18, 1, 2, "B"); fill(g, 19, 18, 1, 2, "B");
    fill(g, 14, 21, 4, 2, "A"); // theme coffee badge on apron
    fill(g, 18, 20, 2, 5, "K");
    fill(g, 8, 18, 2, 4, "W"); fill(g, 8, 22, 2, 2, "S");
    fill(g, 22, 18, 2, 4, "w"); fill(g, 22, 22, 2, 2, "S");
  } else if (coat === "trench") {
    fill(g, 10, 18, 12, 7, "b");
    fill(g, 14, 18, 4, 3, "W");
    fill(g, 15, 18, 2, 4, "A"); // tie
    fill(g, 10, 22, 12, 1, "B"); px(g, 15, 22, "Y"); px(g, 16, 22, "Y"); // belt
    fill(g, 19, 20, 3, 5, "B");
    fill(g, 8, 18, 2, 4, "b"); fill(g, 8, 22, 2, 2, "S");
    fill(g, 22, 18, 2, 4, "B"); fill(g, 22, 22, 2, 2, "S");
  } else if (coat === "fire") {
    fill(g, 10, 18, 12, 7, "A");
    fill(g, 19, 20, 3, 5, "d");
    fill(g, 10, 20, 12, 1, "Y"); fill(g, 10, 23, 12, 1, "Y"); // reflective stripes
    fill(g, 15, 18, 2, 7, "g");
    fill(g, 8, 18, 2, 4, "A"); px(g, 8, 20, "Y"); px(g, 9, 20, "Y"); fill(g, 8, 22, 2, 2, "S");
    fill(g, 22, 18, 2, 4, "d"); px(g, 22, 20, "Y"); px(g, 23, 20, "Y"); fill(g, 22, 22, 2, 2, "S");
  } else if (coat === "vest") {
    fill(g, 10, 18, 12, 7, "W");
    fill(g, 11, 18, 10, 7, "A");
    fill(g, 14, 18, 4, 2, "W"); px(g, 15, 19, "d"); px(g, 16, 19, "d");
    fill(g, 19, 20, 2, 5, "d");
    fill(g, 8, 18, 2, 4, "W"); fill(g, 8, 22, 2, 2, "S");
    fill(g, 22, 18, 2, 4, "w"); fill(g, 22, 22, 2, 2, "S");
  } else if (coat === "overalls") {
    fill(g, 10, 18, 12, 7, "W");
    fill(g, 11, 20, 10, 5, "A");
    fill(g, 12, 18, 2, 2, "A"); fill(g, 18, 18, 2, 2, "A");
    px(g, 12, 20, "Y"); px(g, 19, 20, "Y"); // brass buttons
    fill(g, 14, 22, 4, 2, "d");
    fill(g, 8, 18, 2, 4, "W"); fill(g, 8, 22, 2, 2, "S");
    fill(g, 22, 18, 2, 4, "w"); fill(g, 22, 22, 2, 2, "S");
  } else if (coat === "robe") {
    fill(g, 9, 18, 14, 8, "A");
    fill(g, 9, 18, 3, 2, "a");
    fill(g, 20, 20, 3, 6, "d");
    fill(g, 14, 18, 4, 8, "d");
    px(g, 15, 20, "Y"); px(g, 16, 22, "Y"); px(g, 15, 24, "Y"); // starry trim
    fill(g, 7, 18, 2, 4, "A"); fill(g, 7, 22, 2, 2, "S");
    fill(g, 23, 18, 2, 4, "d"); fill(g, 23, 22, 2, 2, "S");
  } else if (coat === "jersey") {
    fill(g, 10, 18, 12, 7, "A");
    fill(g, 10, 18, 3, 2, "a");

    fill(g, 19, 20, 3, 5, "d");

    fill(g, 10, 18, 12, 7, "A");
    fill(g, 10, 18, 3, 2, "a");
    fill(g, 14, 18, 4, 7, "W"); // inner tee
    fill(g, 19, 20, 3, 5, "d");
    fill(g, 8, 18, 2, 4, "A"); fill(g, 8, 22, 2, 2, "S");
    fill(g, 22, 18, 2, 4, "d"); fill(g, 22, 22, 2, 2, "S");
  }

  // 7. Legs & Boots (y=25..28)
  if (legs === "shorts") {
    fill(g, 11, 25, 4, 1, "N"); fill(g, 17, 25, 4, 1, "N");
    fill(g, 11, 26, 4, 1, "S"); fill(g, 17, 26, 4, 1, "s");
  } else {
    fill(g, 11, 25, 4, 2, "N"); fill(g, 11, 25, 2, 2, "n");
    fill(g, 17, 25, 4, 2, "N");
  }
  const bootMain = boots === "white" ? "W" : boots === "brown" ? "B" : "g";
  const bootSole = boots === "white" ? "w" : "O";
  fill(g, 11, 27, 4, 1, bootMain); fill(g, 10, 28, 5, 1, bootSole);
  fill(g, 17, 27, 4, 1, bootMain); fill(g, 17, 28, 5, 1, bootSole);

  if (extras) extras(g);
  return g;
}

function makeSprite(id, name, gender, palette, idle, animations) {

const PIXEL_SPRITES = {

const PIXEL_ROLE_IDS = Object.keys(PIXEL_SPRITES);

/** Pick a random occupation animation clip for a role, avoiding immediate repeats when `excludeClipId` is given. */
function pickRandomAnimation(roleId, excludeClipId = "", random = Math.random) {
  const sprite = PIXEL_SPRITES[roleId] || PIXEL_SPRITES.coder;
  const clips = sprite.animations;
  const pool = excludeClipId && clips.length > 1 ? clips.filter((c) => c.id !== excludeClipId) : clips;
  return pool[Math.floor(random() * pool.length)] || clips[0];
}

/** Compile a 32×32 character matrix into compact horizontal-run SVG paths grouped by color. */
function compileGrid(matrix, paletteMap) {
  const runs = new Map();
  for (let y = 0; y < PIXEL_GRID_SIZE; y++) {
    const row = matrix[y];
    let x = 0;
    while (x < PIXEL_GRID_SIZE) {
      const ch = row[x];
      if (ch === "." || !paletteMap[ch]) { x++; continue; }
      let end = x + 1;
      while (end < PIXEL_GRID_SIZE && row[end] === ch) end++;
      const fillColor = paletteMap[ch];
      const seg = `M${x} ${y}h${end - x}v1h${x - end}z`;
      const existing = runs.get(fillColor);
      if (existing) existing.push(seg);
      else runs.set(fillColor, [seg]);
      x = end;
    }
  }
  const layers = [];
  let index = 0;
  for (const [fillColor, segments] of runs) {
    layers.push({ key: `${index++}-${fillColor}`, fill: fillColor, d: segments.join("") });
  }
  return layers;
}

const frameCache = new Map();

/**
 * Render (and cache) one frame of a 32×32 pixel citizen as a soft tinted badge + crisp SVG pixel paths.
 * `clipId`: omit/"" for default clip 0 (backward compatible), `"idle"` for calm resting pose, or any clip id in `sprite.animations`.
 */
function renderPixelFrame(roleId, hex = "#3878fb", frameIndex = 0, clipId = "") {
  const sprite = PIXEL_SPRITES[roleId] || PIXEL_SPRITES.coder;
  const color = /^#[0-9a-fA-F]{6}$/.test(hex || "") ? hex : "#3878fb";
  let matrix, cacheKey;
  if (clipId === "idle") {
    matrix = sprite.idle || sprite.frames[0];
    cacheKey = `${sprite.id}|${color}|idle|0`;
  } else {
    const active = clipId ? (sprite.animations.find((c) => c.id === clipId) || sprite.animations[0]) : sprite.animations[0];
    const index = ((frameIndex % active.frames.length) + active.frames.length) % active.frames.length;
    matrix = active.frames[index];
    cacheKey = `${sprite.id}|${color}|${active.id}|${index}`;
  }
  const cached = frameCache.get(cacheKey);
  if (cached) return cached;
  const paletteMap = sprite.palette(color);
  const rendered = {
    bg: shade(color, 0.87),
    border: shade(color, 0.72),
    layers: compileGrid(matrix, paletteMap),
  };
  frameCache.set(cacheKey, rendered);
  return rendered;
}

/** Return the sprite metadata for a role id (falling back to coder). */
function getPixelSprite(roleId) {
  return PIXEL_SPRITES[roleId] || PIXEL_SPRITES.coder;
}

const BOT_SHAPES = ["round","cloud","tile","sparkle","clover","chonk","flower","drop","bean","triangle","gem","cog","hexagon","apple","star","heart","blob","ghost"];
const PIXEL_COLORS = [
  ["black", "#1d1d21"], ["brown", "#94603d"], ["red", "#f2374a"], ["orange", "#ff6b25"],
  ["amber", "#ffa424"], ["green", "#1cc46f"], ["teal", "#0fb4a3"], ["blue", "#3878fb"],
  ["purple", "#9b4ff0"], ["pink", "#f2389d"], ["gray", "#7c7c84"], ["sky", "#30b4f0"],
];
function fnv1a(seed) {
  let hash = 2166136261;
  for (const ch of seed) hash = Math.imul(hash ^ ch.charCodeAt(0), 16777619) >>> 0;
  return hash;
}
function resolvePixelAvatar(value, seed = "") {
  if (typeof value === "string") {
    const pm = /^pixel:([a-z]+):([a-z]+)$/.exec(value);
    if (pm && PIXEL_SPRITES[pm[1]]) {
      const c = PIXEL_COLORS.find((item) => item[0] === pm[2]);
      if (c) return { role: pm[1], color: c[0], hex: c[1] };
    }
    const bm = /^bot:([a-z]+):([a-z]+)$/.exec(value);
    if (bm) {
      const idx = BOT_SHAPES.indexOf(bm[1]);
      const c = PIXEL_COLORS.find((item) => item[0] === bm[2]);
      if (idx >= 0 && c) return { role: PIXEL_ROLE_IDS[idx % PIXEL_ROLE_IDS.length], color: c[0], hex: c[1] };
    }
  }
  const hash = fnv1a(seed || "");
  const role = PIXEL_ROLE_IDS[hash % PIXEL_ROLE_IDS.length];
  const c = PIXEL_COLORS[(hash >>> 8) % PIXEL_COLORS.length];
  return { role, color: c[0], hex: c[1] };
}
window.PixelAvatar = { PIXEL_GRID_SIZE, resolvePixelAvatar, renderPixelFrame, getPixelSprite, pickRandomAnimation };
})();
</script>

<script type="module">
import { marked } from "./marked.js";

marked.setOptions({ gfm: true, breaks: true, async: false });

const API = location.pathname.replace(/\/?$/, "/") + "api/";
const el = {
  card: document.getElementById("card"),
  who: document.getElementById("who"),
  sub: document.getElementById("sub"),
  empList: document.getElementById("empList"),
  grpList: document.getElementById("grpList"),
  empCount: document.getElementById("empCount"),
  grpCount: document.getElementById("grpCount"),
  stream: document.getElementById("stream"),
  latest: document.getElementById("latest"),
  input: document.getElementById("input"),
  send: document.getElementById("send"),
  plus: document.getElementById("plus"),
  menu: document.getElementById("menu"),
  error: document.getElementById("error"),
  settings: document.getElementById("settings"),
  close: document.getElementById("close")
};

const state = { threads: { employees: [], groups: [] }, current: "", title: "", avatar: "", authors: {}, messages: [], lastSeq: 0, newFrom: 0, markGone: false, running: false, busy: false, stick: true };

// 跟随任务栏明暗（WebView2 跟随应用主题）。
const scheme = matchMedia("(prefers-color-scheme: dark)");
const applyScheme = () => document.documentElement.classList.toggle("light", !scheme.matches);
applyScheme();
scheme.addEventListener("change", applyScheme);

const esc = (text) => String(text ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const initials = (name) => (String(name || "").trim().slice(0, 1) || "·");

// ── 热心市民头像（pixel-avatar）──────────────────────────────
// state.avatar = 当前会话中热心市民的头像预设；state.authors = 群聊各成员 kind:id → {avatar}。
function pixelPathsHTML(layers) {
  return layers.map((l) => `<path d="${l.d}" fill="${l.fill}"/>`).join("");
}
/** 一个头像的 SVG 标记。employee 头像渲染为 32×32 像素小人，用户头像仍是字母块。
    animate=true 的头像渲染后由 driveAvatars() 从该职业的 5 组独立动画中随机抽取播放。 */
function avatarHTML(preset, seed, animate, wrap = "ta-avatar") {
  const pixel = PixelAvatar.resolvePixelAvatar(preset, seed || "");
  const size = PixelAvatar.PIXEL_GRID_SIZE || 32;
  const frame = PixelAvatar.renderPixelFrame(pixel.role, pixel.hex, 0, "idle");
  const svg = `<svg class="pixel-avatar" data-pixel="1" ${animate ? 'data-animate="1" ' : ""}data-role="${esc(pixel.role)}" data-color="${esc(pixel.hex)}" viewBox="0 0 ${size} ${size}" role="img" aria-hidden="true"><rect x="0" y="0" width="${size}" height="${size}" rx="6.8" fill="${frame.bg}"/><g data-layers="1" shape-rendering="crispEdges">${pixelPathsHTML(frame.layers)}</g></svg>`;
  return `<span class="${wrap} bot">${svg}</span>`;
}

/* 让 data-animate 的像素小人从各自职业的 5 组独立动画中随机抽取并轮换播放。
   每次 renderStream 之后调一次：清理旧定时器并按新 DOM 重挂。 */
const avatarAnim = { timers: [], lastByRole: new Map() };
function driveAvatars() {
  for (const id of avatarAnim.timers) clearTimeout(id);
  avatarAnim.timers = [];
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (const svg of document.querySelectorAll("svg.pixel-avatar[data-animate]")) {
    const role = svg.dataset.role || "coder";
    const hex = svg.dataset.color || "#3878fb";
    const group = svg.querySelector("[data-layers]");
    if (!group) continue;
    let activeClip = PixelAvatar.pickRandomAnimation(role, avatarAnim.lastByRole.get(role) || "");
    avatarAnim.lastByRole.set(role, activeClip.id);
    let index = 0, loopsLeft = 2;
    const renderCurrent = (clipId, frameIdx) => {
      const frame = PixelAvatar.renderPixelFrame(role, hex, frameIdx, clipId);
      group.innerHTML = pixelPathsHTML(frame.layers);
    };
    const step = () => {
      if (!svg.isConnected) return;
      index += 1;
      if (index < activeClip.frames.length) {
        renderCurrent(activeClip.id, index);
        avatarAnim.timers.push(setTimeout(step, activeClip.durations[index] ?? 160));
        return;
      }
      loopsLeft -= 1;
      if (loopsLeft > 0) {
        index = 0;
        renderCurrent(activeClip.id, 0);
        avatarAnim.timers.push(setTimeout(step, activeClip.durations[0] ?? 160));
        return;
      }
      renderCurrent("idle", 0);
      avatarAnim.timers.push(setTimeout(() => {
        if (!svg.isConnected) return;
        activeClip = PixelAvatar.pickRandomAnimation(role, activeClip.id);
        avatarAnim.lastByRole.set(role, activeClip.id);
        index = 0; loopsLeft = 2;
        renderCurrent(activeClip.id, 0);
        avatarAnim.timers.push(setTimeout(step, activeClip.durations[0] ?? 160));
      }, 240 + Math.round(Math.random() * 200)));
    };
    renderCurrent(activeClip.id, 0);
    const firstDelay = Math.round((activeClip.durations[0] ?? 160) * (0.4 + Math.random() * 0.6));
    avatarAnim.timers.push(setTimeout(step, firstDelay));
  }
}
/** 交付气泡里的任务行：delivery=true 的 assistant 消息带 tasks:[{id,title,status}]。 */
const askTask = (message) => (message?.delivery && Array.isArray(message.tasks) && message.tasks[0]) || undefined;
/** 只有还等着作答的待确认才给卡片；做完的交付退回普通消息。 */
const askOpen = (message) => ["waiting", "approval"].includes(askTask(message)?.status);
/** 去掉消息开头的「**需要你处理**」加粗标题，正文是问的内容或要确认的东西。 */
const askBody = (text) => String(text ?? "").replace(/^\s*\*\*[^*]+\*\*\s*/, "").trim();

/** Nova 的 tb-ask：审批按「允许/拒绝」、提问按输入框「提交回答」。status 变了就只剩记录，不再能点。 */
function askHTML(message) {
  const task = askTask(message);
  const approval = task.status === "approval";
  const badge = approval ? "需要你确认" : "需要你回答";
  const body = esc(askBody(message.displayText || message.text));
  const agent = `<span class="tb-ask-agent">${esc(message.author?.name || state.title || "数字员工")}</span>`;
  let inner = `<div class="tb-ask-head"><span class="tb-ask-badge">${badge}</span>${agent}</div>`;
  if (task.title) inner += `<div class="tb-ask-thread">${esc(task.title)}</div>`;
  if (approval) {
    if (body) inner += `<pre class="tb-code">${body}</pre>`;
    inner += `<div class="tb-actions">
      <button class="tb-btn allow" data-task="${esc(task.id)}" data-act="approve" data-ok="1">允许</button>
      <button class="tb-btn reject" data-task="${esc(task.id)}" data-act="approve" data-ok="0">拒绝</button>
    </div>`;
  } else {
    inner += `<div class="tb-question"><div class="tb-question-text">${body}</div></div>
    <textarea class="tb-input" data-answer="${esc(task.id)}" rows="2" placeholder="补充它要的信息，提交后接着做"></textarea>
    <div class="tb-actions">
      <button class="tb-btn allow" data-task="${esc(task.id)}" data-act="answer">提交回答</button>
      <button class="tb-btn reject" data-task="${esc(task.id)}" data-act="stop">拒绝</button>
    </div>`;
  }
  return `<section class="tb-ask" data-ask="${esc(task.id)}">${inner}</section>`;
}
/** 会话卡片只放一行预览，markdown 记号会看着脏，先拍平。 */
const plain = (text) => String(text ?? "")
  .replace(/```[\s\S]*?```/g, "〔代码〕")
  .replace(/!?\[([^\]]*)\]\([^)\s]*\)/g, "$1")
  .replace(/[`*_~#>]/g, "")
  .replace(/\s+/g, " ")
  .trim();

/** 只留安全的节点与属性：模型输出里的脚本、事件属性、javascript: 链接一律去掉。 */
function sanitize(html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  tpl.content.querySelectorAll("script,iframe,object,embed,link,style,meta,base,form").forEach((node) => node.remove());
  tpl.content.querySelectorAll("*").forEach((node) => {
    for (const attr of [...node.attributes]) {
      const name = attr.name.toLowerCase();
      if (name.startsWith("on")) node.removeAttribute(attr.name);
      else if (["href", "src", "srcset", "xlink:href"].includes(name) && /^\s*(javascript|data:text\/html):/i.test(attr.value)) node.removeAttribute(attr.name);
    }
  });
  return tpl.innerHTML;
}

async function api(op, body) {
  const response = await fetch(API + op, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.statusMessage || data.error || ("HTTP " + response.status));
  return data;
}

function toast(message) {
  el.error.textContent = message;
  el.error.hidden = !message;
  clearTimeout(toast.timer);
  if (message) toast.timer = setTimeout(() => { el.error.hidden = true; }, 4000);
}

// ── 左栏 ────────────────────────────────────────────────
function sessionCard(item) {
  const on = item.thread === state.current ? " on" : "";
  const status = item.waiting ? ['waiting', "待确认"] : item.running ? ["running", "正在工作"] : item.kind === "group" ? ["", `${item.users} 位用户 · ${item.employees} 位热心市民`] : ["", item.mine ? "我的热心市民" : "共享热心市民"];
  const badge = item.unread ? `<span class="ta-badge">${item.unread > 99 ? "99+" : item.unread}</span>` : "";
  // 热心市民使用预设 SVG 头像，执行任务时播放动画；群聊没有单头像就用首字母块。
  const isEmployee = item.kind !== "group" && item.thread?.startsWith("employee:");
  const seed = isEmployee ? item.thread.slice(9) : "";
  const face = isEmployee
    ? avatarHTML(item.avatar, seed, !!item.runningTasks, "ta-session-face")
    : `<span class="ta-session-face">${esc(initials(item.name))}</span>`;
  return `<button class="ta-session${on}" data-thread="${esc(item.thread)}">
    <span class="ta-session-heading">${face}<strong>${esc(item.name)}</strong>${badge}<span class="ta-status ${status[0]}">${esc(status[1])}</span></span>
    <span class="ta-session-text">${esc(plain(item.lastText) || "还没有对话")}</span>
  </button>`;
}

function renderRail() {
  const { employees, groups } = state.threads;
  el.empList.innerHTML = employees.length ? employees.map(sessionCard).join("") : '<div class="ta-empty">还没有热心市民</div>';
  el.grpList.innerHTML = groups.length ? groups.map(sessionCard).join("") : '<div class="ta-empty">还没有群聊</div>';
  el.empCount.textContent = employees.length || "";
  el.grpCount.textContent = groups.length || "";
  for (const node of document.querySelectorAll(".ta-session")) {
    node.addEventListener("click", () => open(node.dataset.thread));
  }
  // 左栏重建后动起来的头像要重挂定时器。
  driveAvatars();
}

function threadOf(thread) {
  return [...state.threads.employees, ...state.threads.groups].find((item) => item.thread === thread);
}

// ── 会话 ────────────────────────────────────────────────
// Nova 的 ta-message-meta 只放会话状态/打开会话按钮，没有消息时间戳。
// 每个线程在本机记住看到的位置，切进来时把它之后的消息标成新的；来了新消息或切出再进来就不再出现。
const seen = {
  key: (thread) => "vega.assistant.seen:" + thread,
  of(thread) { try { return Number(localStorage.getItem(this.key(thread))) || 0; } catch { return 0; } },
  at(thread, seq) { try { if (seq) localStorage.setItem(this.key(thread), String(seq)); } catch {} },
};
const newLine = () => `<div class="ta-new${state.markGone ? " gone" : ""}" role="separator"><span>新</span></div>`;

function stepOutputOf(message) {
  if (message.stepOutput && typeof message.stepOutput === "object") return message.stepOutput;
  const prefix = "**步骤产物（任务未完成）**\n\n", text = String(message.text || "");
  if (message.stepOutput !== true || !text.startsWith(prefix)) return null;
  const rest = text.slice(prefix.length), split = rest.indexOf("\n\n");
  return { label: split < 0 ? "历史步骤产物" : rest.slice(0, split), text: split < 0 ? rest : rest.slice(split + 2) };
}

function stepOutputHTML(message) {
  const output = stepOutputOf(message);
  if (!output) return "";
  const files = (output.files || []).filter((file) => /^blob-[a-f\d]{32}$/.test(file.blobId || ""));
  const content = output.text ? `<details><summary>查看内容</summary><div class="ta-md">${sanitize(marked.parse(output.text))}</div></details>` : "";
  const actions = files.map((file) => `<button type="button" data-step-file="${esc(file.blobId)}" data-step-name="${esc(file.name)}">下载 ${esc(file.name)}</button>`).join("") +
    (output.text ? `<button type="button" data-step-export="${Number(message.seq) || 0}">导出 Markdown</button>` : "");
  return `<section class="ta-step-output"><strong>步骤产物${output.step ? ` · 第 ${Number(output.step)} 步` : ""}</strong><span>${esc(output.label || "")}</span>${content}${actions ? `<div class="ta-step-actions">${actions}</div>` : ""}</section>`;
}

function messageHTML(message) {
  if (message.notice) return `<div class="ta-notice"><span>${esc(message.text || "")}</span></div>`;
  if (message.role !== "user" && message.role !== "assistant") return "";
  const text = message.stepOutput === true && stepOutputOf(message) ? "步骤产物已保存。" : message.displayText || message.text || "";
  const mine = message.role === "user" && !message.author;
  const other = message.author && message.author.kind === "user" && !mine;
  const ask = message.role === "assistant" && askOpen(message);
  const body = ask ? askHTML(message) : text ? (message.role === "assistant" ? `<div class="ta-md">${sanitize(marked.parse(text))}</div>` : esc(text)) : "";
  const chips = [];
  if (message.images?.length) chips.push(`${message.images.length} 张图片`);
  if (message.files?.length) chips.push(`${message.files.length} 个文件`);
  const chipHTML = !ask && chips.length ? `<div class="ta-chips">${chips.map((c) => `<span class="ta-chip">${esc(c)}</span>`).join("")}</div>` : "";
  // 热心市民使用预设 SVG 头像（私聊显示对方，群聊显示发言者），一律静止看向右上；只有左栏任务执行中的头像会动。
  const isEmployeeThread = state.current.startsWith("employee:");
  let avatars;
  if (message.role === "user") {
    avatars = other ? `<span class="ta-avatar">${esc(initials(message.author.name))}</span>` : "";
  } else if (isEmployeeThread) {
    avatars = avatarHTML(state.avatar, state.current.slice(9));
  } else {
    const key = message.author ? message.author.kind + ":" + message.author.id : "";
    const preset = state.authors[key]?.avatar;
    avatars = message.author?.kind === "employee" && preset
      ? avatarHTML(preset, message.author.id)
      : `<span class="ta-avatar">${esc(initials(message.author?.name || state.title))}</span>`;
  }
  const author = other ? `<div class="ta-author">${esc(message.author.name)}</div>` : "";
  const classes = ["ta-bubble"];
  if (ask) classes.push("ask");
  else if (message.role === "assistant") classes.push(body ? "md" : "");
  if (message.error) classes.push("error");
  if (message.progress) classes.push("progress");
  return `<div class="ta-message ${message.role === "user" ? "user" : "bot"}">${avatars}
    <div class="ta-message-content">${author}<div class="${classes.join(" ")}">${body}${chipHTML}</div>${stepOutputHTML(message)}</div>
  </div>`;
}

function renderStream(scroll = false) {
  const thread = state.current;
  if (!thread) return;
  const parts = state.messages.map((message) => messageHTML(message));
  // 只分新旧：上次看到的位置之后第一条可见消息前画一条「新」；一直在本线程就不再出现。
  const first = state.newFrom > 0 ? parts.findIndex((part, index) => part && state.messages[index].seq > state.newFrom) : -1;
  let html = parts.map((part, index) => (index > 0 && index === first ? newLine() : "") + part).join("");
  if (state.running) {
    const typingAvatar = state.current.startsWith("employee:") ? avatarHTML(state.avatar, state.current.slice(9)) : `<span class="ta-avatar">${esc(initials(state.title))}</span>`;
    html += `<div class="ta-message bot">${typingAvatar}
      <div class="ta-message-content"><div class="ta-bubble typing">正在工作<span class="ta-dots"><i></i><i></i><i></i></span></div></div></div>`;
  }
  el.stream.innerHTML = html || `<div class="ta-welcome">还没有消息<small>说一句话就能开工</small></div>`;
  driveAvatars();
  if (scroll || state.stick) scrollToEnd();
  el.latest.hidden = state.stick;
}

function scrollToEnd() {
  el.stream.scrollTop = el.stream.scrollHeight;
  state.stick = true;
  el.latest.hidden = true;
}

// ── 待确认 ──────────────────────────────────────────────
// 待确认气泡上的按钮：approve 用「允许/拒绝」，waiting 用输入框「提交回答」或「拒绝」。
async function controlTask(taskId, action, extra) {
  if (state.busy) return;
  state.busy = true;
  try {
    await api("control", { thread: state.current, id: taskId, action, ...extra });
    setTimeout(pollMessages, 200);
    setTimeout(pollThreads, 200);
  } catch (error) {
    toast(error.message);
  } finally {
    state.busy = false;
  }
}

function saveStepFile(data, name, type) {
  const url = URL.createObjectURL(new Blob([data], { type }));
  const link = document.createElement("a");
  link.href = url;
  link.download = String(name || "步骤产物").replace(/[\\/:*?"<>|\x00-\x1f]/g, "_").slice(0, 120);
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

el.stream.addEventListener("click", (event) => {
  const file = event.target.closest?.("[data-step-file]");
  if (file && !file.disabled) {
    file.disabled = true;
    void api("file", { blobId: file.dataset.stepFile }).then((result) => {
      const raw = atob(result.data), bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      saveStepFile(bytes, file.dataset.stepName, "application/octet-stream");
    }).catch((error) => toast(error.message)).finally(() => { file.disabled = false; });
    return;
  }
  const exportButton = event.target.closest?.("[data-step-export]");
  if (exportButton) {
    const message = state.messages.find((item) => item.seq === Number(exportButton.dataset.stepExport));
    const output = message && stepOutputOf(message);
    if (output?.text) saveStepFile(output.text, (output.label || "步骤产物").slice(0, 110) + ".md", "text/markdown;charset=utf-8");
    return;
  }
  const button = event.target.closest?.(".tb-btn");
  if (!button || button.disabled) return;
  const { task, act, ok } = button.dataset;
  if (act === "approve") controlTask(task, "approve", { approved: ok === "1" });
  else if (act === "stop") controlTask(task, "stop", {});
  else if (act === "answer") {
    const input = el.stream.querySelector(`textarea[data-answer="${CSS.escape(task)}"]`);
    const text = input?.value.trim();
    if (!text) { input?.focus(); return; }
    controlTask(task, "answer", { text });
  }
});

function updateHead() {
  const item = threadOf(state.current);
  el.who.textContent = state.title || item?.name || "Vega 助理";
  const status = item?.waiting ? "等待你确认" : state.running ? "正在工作…" : item ? (item.kind === "group" ? `${item.users} 位用户 · ${item.employees} 位热心市民` : (item.mine ? "我的热心市民" : "共享热心市民")) : "选择一位热心市民或一个群聊";
  el.sub.textContent = status;
  el.card.className = "tb-card" + (item?.waiting ? " waiting" : state.running ? " running" : "");
}

async function open(thread) {
  if (!thread) return;
  state.current = thread;
  state.messages = [];
  state.lastSeq = 0;
  state.running = false;
  state.stick = true;
  state.avatar = "";
  state.authors = {};
  state.title = threadOf(thread)?.name || "";
  state.newFrom = seen.of(thread);
  state.markGone = false;
  try { localStorage.setItem("vega.assistant.thread", thread); } catch {}
  updateHead();
  renderRail();
  el.stream.innerHTML = `<div class="ta-welcome">正在打开…</div>`;
  try {
    const data = await api("messages", { thread, limit: 100 });
    if (state.current !== thread) return;
    state.messages = data.messages || [];
    state.lastSeq = data.lastSeq || (state.messages.at(-1)?.seq ?? 0);
    state.running = !!data.running;
    state.title = data.title || state.title;
    if (data.avatar !== undefined) state.avatar = data.avatar;
    if (data.authors !== undefined) state.authors = data.authors;
    seen.at(thread, state.lastSeq);
    updateHead();
    renderStream(true);
    api("read", { thread }).then(() => {
      const item = threadOf(thread);
      if (item) { item.unread = 0; renderRail(); }
    }).catch(() => {});
  } catch (error) {
    el.stream.innerHTML = `<div class="ta-welcome">打不开这个会话<small>${esc(error.message)}</small></div>`;
    toast(error.message);
  }
}

async function pollMessages() {
  const thread = state.current;
  if (!thread) return;
  try {
    const data = await api("messages", { thread, after: state.lastSeq });
    if (state.current !== thread) return;
    // 清空聊天或重置热心市民会删除历史，新的 seq 从 1 重新数：服务器序号比本地还小就整段重开，
    // 否则一直拿旧的 lastSeq 等新消息，对话永远停在被删掉的旧内容上。
    if (typeof data.lastSeq === "number" && data.lastSeq < state.lastSeq) { await open(thread); return; }
    const fresh = (data.messages || []).filter((m) => m.seq > state.lastSeq);
    const running = !!data.running;
    if (data.avatar !== undefined) state.avatar = data.avatar;
    if (data.authors !== undefined) state.authors = data.authors;
    if (fresh.length) {
      state.messages.push(...fresh);
      state.lastSeq = data.lastSeq || fresh.at(-1).seq;
      state.markGone = true;
      seen.at(thread, state.lastSeq);
    }
    if (fresh.length || running !== state.running) {
      state.running = running;
      updateHead();
      renderStream();
    }
  } catch {}
}

async function pollThreads() {
  try {
    const data = await api("threads", {});
    state.threads = { employees: data.employees || [], groups: data.groups || [] };
    // 左栏永远跟着刷新：还没选中会话时也要重画，否则一旦空过一次就一直是「还没有热心市民」。
    renderRail();
    if (!state.current) return;
    updateHead();
  } catch {}
}

// ── 发送 ────────────────────────────────────────────────
async function send(text) {
  const value = (text ?? el.input.value).trim();
  if (!value || !state.current || state.busy) return;
  state.busy = true;
  el.send.disabled = true;
  try {
    await api("send", { thread: state.current, text: value });
    if (text === undefined) { el.input.value = ""; grow(); }
    state.running = true;
    state.stick = true;
    renderStream(true);
    setTimeout(pollMessages, 300);
  } catch (error) {
    toast(error.message);
  } finally {
    state.busy = false;
    el.send.disabled = !el.input.value.trim();
  }
}

function grow() {
  el.input.style.height = "auto";
  el.input.style.height = Math.min(96, el.input.scrollHeight) + "px";
  el.send.disabled = !el.input.value.trim() || !state.current;
}

// ── 事件 ────────────────────────────────────────────────
el.input.addEventListener("input", grow);
el.input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); send(); }
});
el.send.addEventListener("click", () => send());
el.latest.addEventListener("click", scrollToEnd);
el.stream.addEventListener("scroll", () => {
  const gap = el.stream.scrollHeight - el.stream.scrollTop - el.stream.clientHeight;
  state.stick = gap < 24;
  el.latest.hidden = state.stick;
});
el.close.addEventListener("click", () => { fetch(API + "close", { method: "POST" }).catch(() => {}); });
// 设置就在这个窗口里：同一个本地令牌，/assistant/<token>/ → /config/<token>。
el.settings.addEventListener("click", () => {
  location.href = location.pathname.replace("/assistant/", "/config/").replace(/\/$/, "");
});
el.plus.addEventListener("click", (event) => {
  event.stopPropagation();
  el.menu.hidden = !el.menu.hidden;
  el.plus.classList.toggle("open", !el.menu.hidden);
});
el.menu.addEventListener("click", (event) => {
  const act = event.target.closest("button")?.dataset.act;
  el.menu.hidden = true;
  el.plus.classList.remove("open");
  if (act === "new") send("/new");
  if (act === "reload") { open(state.current); pollThreads(); }
});
document.addEventListener("click", () => { el.menu.hidden = true; el.plus.classList.remove("open"); });

async function boot() {
  try {
    const data = await api("threads", {});
    state.threads = { employees: data.employees || [], groups: data.groups || [] };
    const wanted = decodeURIComponent((location.hash.match(/thread=([^&]+)/) || [])[1] || "") || localStorage.getItem("vega.assistant.thread") || "";
    const all = [...state.threads.employees, ...state.threads.groups];
    const first = all.find((item) => item.thread === wanted) || all[0];
    renderRail();
    if (first) await open(first.thread);
  } catch (error) {
    el.stream.innerHTML = `<div class="ta-welcome">连不上站点<small>${esc(error.message)}</small></div>`;
    toast(error.message);
  }
}

boot();
setInterval(pollMessages, 1500);
setInterval(pollThreads, 5000);
</script>
</body>
</html>
