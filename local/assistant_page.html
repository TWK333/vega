  send: document.getElementById("send"),
  plus: document.getElementById("plus"),
  menu: document.getElementById("menu"),
  error: document.getElementById("error"),
  settings: document.getElementById("settings"),
  close: document.getElementById("close")
};

const state = { threads: { employees: [], groups: [] }, current: "", title: "", avatar: "", authors: {}, messages: [], lastSeq: 0, newFrom: 0, markGone: false, running: false, busy: false, stick: true };

// 跟随任务栏明暗（WebView2 跟随应用主题）。
const scheme = matchMedia("(prefers-color-scheme: dark)");
const applyScheme = () => document.documentElement.classList.toggle("light", !scheme.matches);
applyScheme();
scheme.addEventListener("change", applyScheme);

const esc = (text) => String(text ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const initials = (name) => (String(name || "").trim().slice(0, 1) || "·");

// ── 热心市民头像（pixel-avatar）──────────────────────────────
// state.avatar = 当前会话中热心市民的头像预设；state.authors = 群聊各成员 kind:id → {avatar}。
function pixelPathsHTML(layers) {
  return layers.map((l) => `<path d="${l.d}" fill="${l.fill}"/>`).join("");
}
/** 一个头像的 SVG 标记。employee 头像渲染为 64×64 像素小人，用户头像仍是字母块。
    animate=true 的头像渲染后由 driveAvatars() 从该职业的 5 组独立动画中随机抽取播放。 */
function avatarHTML(preset, seed, animate, wrap = "ta-avatar") {
  const pixel = PixelAvatar.resolvePixelAvatar(preset, seed || "");
  const size = PixelAvatar.PIXEL_GRID_SIZE || 64;
  const frame = PixelAvatar.renderPixelFrame(pixel.role, pixel.hex, 0, "idle");
  const svg = `<svg class="pixel-avatar" data-pixel="1" ${animate ? 'data-animate="1" ' : ""}data-role="${esc(pixel.role)}" data-color="${esc(pixel.hex)}" viewBox="0 0 ${size} ${size}" role="img" aria-hidden="true"><rect x="0" y="0" width="${size}" height="${size}" rx="13.6" fill="${frame.bg}"/><g data-layers="1" shape-rendering="crispEdges">${pixelPathsHTML(frame.layers)}</g></svg>`;
  return `<span class="${wrap} bot">${svg}</span>`;
}

/* 让 data-animate 的像素小人从各自职业的 5 组独立动画中随机抽取并轮换播放。
   每次 renderStream 之后调一次：清理旧定时器并按新 DOM 重挂。 */
const avatarAnim = { timers: [], lastByRole: new Map() };
function driveAvatars() {
  for (const id of avatarAnim.timers) clearTimeout(id);
  avatarAnim.timers = [];
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (const svg of document.querySelectorAll("svg.pixel-avatar[data-animate]")) {
    const role = svg.dataset.role || "coder";
    const hex = svg.dataset.color || "#3878fb";
    const group = svg.querySelector("[data-layers]");
    if (!group) continue;
    let activeClip = PixelAvatar.pickRandomAnimation(role, avatarAnim.lastByRole.get(role) || "");
    avatarAnim.lastByRole.set(role, activeClip.id);
    let index = 0, loopsLeft = activeClip.durations.reduce((s, d) => s + d, 0) < 2000 ? 2 : 1;
    const renderCurrent = (clipId, frameIdx) => {
      const frame = PixelAvatar.renderPixelFrame(role, hex, frameIdx, clipId);
      group.innerHTML = pixelPathsHTML(frame.layers);
    };
    const step = () => {
      if (!svg.isConnected) return;
      index += 1;
      if (index < activeClip.keyframes.length) {
        renderCurrent(activeClip.id, index);
        avatarAnim.timers.push(setTimeout(step, activeClip.durations[index] ?? 160));
        return;
      }
      loopsLeft -= 1;
      if (loopsLeft > 0) {
        index = 0;
        renderCurrent(activeClip.id, 0);
        avatarAnim.timers.push(setTimeout(step, activeClip.durations[0] ?? 160));
        return;
      }
      renderCurrent("idle", 0);
      avatarAnim.timers.push(setTimeout(() => {
        if (!svg.isConnected) return;
        activeClip = PixelAvatar.pickRandomAnimation(role, activeClip.id);
        avatarAnim.lastByRole.set(role, activeClip.id);
        index = 0; loopsLeft = activeClip.durations.reduce((s, d) => s + d, 0) < 2000 ? 2 : 1;
        renderCurrent(activeClip.id, 0);
        avatarAnim.timers.push(setTimeout(step, activeClip.durations[0] ?? 160));
      }, 240 + Math.round(Math.random() * 200)));
    };
    renderCurrent(activeClip.id, 0);
    const firstDelay = Math.round((activeClip.durations[0] ?? 160) * (0.4 + Math.random() * 0.6));
    avatarAnim.timers.push(setTimeout(step, firstDelay));
  }
}
/** 交付气泡里的任务行：delivery=true 的 assistant 消息带 tasks:[{id,title,status}]。 */
const askTask = (message) => (message?.delivery && Array.isArray(message.tasks) && message.tasks[0]) || undefined;
/** 只有还等着作答的待确认才给卡片；做完的交付退回普通消息。 */
const askOpen = (message) => ["waiting", "approval"].includes(askTask(message)?.status);
/** 去掉消息开头的「**需要你处理**」加粗标题，正文是问的内容或要确认的东西。 */
const askBody = (text) => String(text ?? "").replace(/^\s*\*\*[^*]+\*\*\s*/, "").trim();

/** Nova 的 tb-ask：审批按「允许/拒绝」、提问按输入框「提交回答」。status 变了就只剩记录，不再能点。 */
function askHTML(message) {
  const task = askTask(message);
  const approval = task.status === "approval";
  const badge = approval ? "需要你确认" : "需要你回答";
  const body = esc(askBody(message.displayText || message.text));
  const agent = `<span class="tb-ask-agent">${esc(message.author?.name || state.title || "数字员工")}</span>`;
  let inner = `<div class="tb-ask-head"><span class="tb-ask-badge">${badge}</span>${agent}</div>`;
  if (task.title) inner += `<div class="tb-ask-thread">${esc(task.title)}</div>`;
  if (approval) {
    if (body) inner += `<pre class="tb-code">${body}</pre>`;
    inner += `<div class="tb-actions">
      <button class="tb-btn allow" data-task="${esc(task.id)}" data-act="approve" data-ok="1">允许</button>
      <button class="tb-btn reject" data-task="${esc(task.id)}" data-act="approve" data-ok="0">拒绝</button>
    </div>`;
  } else {
    inner += `<div class="tb-question"><div class="tb-question-text">${body}</div></div>
    <textarea class="tb-input" data-answer="${esc(task.id)}" rows="2" placeholder="补充它要的信息，提交后接着做"></textarea>
    <div class="tb-actions">
      <button class="tb-btn allow" data-task="${esc(task.id)}" data-act="answer">提交回答</button>
      <button class="tb-btn reject" data-task="${esc(task.id)}" data-act="stop">拒绝</button>
    </div>`;
  }
  return `<section class="tb-ask" data-ask="${esc(task.id)}">${inner}</section>`;
}
/** 会话卡片只放一行预览，markdown 记号会看着脏，先拍平。 */
const plain = (text) => String(text ?? "")
  .replace(/```[\s\S]*?```/g, "〔代码〕")
  .replace(/!?\[([^\]]*)\]\([^)\s]*\)/g, "$1")
  .replace(/[`*_~#>]/g, "")
  .replace(/\s+/g, " ")
  .trim();

/** 只留安全的节点与属性：模型输出里的脚本、事件属性、javascript: 链接一律去掉。 */
function sanitize(html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  tpl.content.querySelectorAll("script,iframe,object,embed,link,style,meta,base,form").forEach((node) => node.remove());
  tpl.content.querySelectorAll("*").forEach((node) => {
    for (const attr of [...node.attributes]) {
      const name = attr.name.toLowerCase();
      if (name.startsWith("on")) node.removeAttribute(attr.name);
      else if (["href", "src", "srcset", "xlink:href"].includes(name) && /^\s*(javascript|data:text\/html):/i.test(attr.value)) node.removeAttribute(attr.name);
    }
  });
  return tpl.innerHTML;
}

async function api(op, body) {
  const response = await fetch(API + op, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.statusMessage || data.error || ("HTTP " + response.status));
  return data;
}

function toast(message) {
  el.error.textContent = message;
  el.error.hidden = !message;
  clearTimeout(toast.timer);
  if (message) toast.timer = setTimeout(() => { el.error.hidden = true; }, 4000);
}

// ── 左栏 ────────────────────────────────────────────────
function sessionCard(item) {
  const on = item.thread === state.current ? " on" : "";
  const status = item.waiting ? ['waiting', "待确认"] : item.running ? ["running", "正在工作"] : item.kind === "group" ? ["", `${item.users} 位用户 · ${item.employees} 位热心市民`] : ["", item.mine ? "我的热心市民" : "共享热心市民"];
  const badge = item.unread ? `<span class="ta-badge">${item.unread > 99 ? "99+" : item.unread}</span>` : "";
  // 热心市民使用预设 SVG 头像，执行任务时播放动画；群聊没有单头像就用首字母块。
  const isEmployee = item.kind !== "group" && item.thread?.startsWith("employee:");
  const seed = isEmployee ? item.thread.slice(9) : "";
  const face = isEmployee
    ? avatarHTML(item.avatar, seed, !!item.runningTasks, "ta-session-face")
    : `<span class="ta-session-face">${esc(initials(item.name))}</span>`;
  return `<button class="ta-session${on}" data-thread="${esc(item.thread)}">
    <span class="ta-session-heading">${face}<strong>${esc(item.name)}</strong>${badge}<span class="ta-status ${status[0]}">${esc(status[1])}</span></span>
    <span class="ta-session-text">${esc(plain(item.lastText) || "还没有对话")}</span>
  </button>`;
}

function renderRail() {
  const { employees, groups } = state.threads;
  el.empList.innerHTML = employees.length ? employees.map(sessionCard).join("") : '<div class="ta-empty">还没有热心市民</div>';
  el.grpList.innerHTML = groups.length ? groups.map(sessionCard).join("") : '<div class="ta-empty">还没有群聊</div>';
  el.empCount.textContent = employees.length || "";
  el.grpCount.textContent = groups.length || "";
  for (const node of document.querySelectorAll(".ta-session")) {
    node.addEventListener("click", () => open(node.dataset.thread));
  }
  // 左栏重建后动起来的头像要重挂定时器。
  driveAvatars();
}

function threadOf(thread) {
  return [...state.threads.employees, ...state.threads.groups].find((item) => item.thread === thread);
}

// ── 会话 ────────────────────────────────────────────────
// Nova 的 ta-message-meta 只放会话状态/打开会话按钮，没有消息时间戳。
// 每个线程在本机记住看到的位置，切进来时把它之后的消息标成新的；来了新消息或切出再进来就不再出现。
const seen = {
  key: (thread) => "vega.assistant.seen:" + thread,
  of(thread) { try { return Number(localStorage.getItem(this.key(thread))) || 0; } catch { return 0; } },
  at(thread, seq) { try { if (seq) localStorage.setItem(this.key(thread), String(seq)); } catch {} },
};
const newLine = () => `<div class="ta-new${state.markGone ? " gone" : ""}" role="separator"><span>新</span></div>`;

function stepOutputOf(message) {
  if (message.stepOutput && typeof message.stepOutput === "object") return message.stepOutput;
  const prefix = "**步骤产物（任务未完成）**\n\n", text = String(message.text || "");
  if (message.stepOutput !== true || !text.startsWith(prefix)) return null;
  const rest = text.slice(prefix.length), split = rest.indexOf("\n\n");
  return { label: split < 0 ? "历史步骤产物" : rest.slice(0, split), text: split < 0 ? rest : rest.slice(split + 2) };
}

function stepOutputHTML(message) {
  const output = stepOutputOf(message);
  if (!output) return "";
  const files = (output.files || []).filter((file) => /^blob-[a-f\d]{32}$/.test(file.blobId || ""));
  const content = output.text ? `<details><summary>查看内容</summary><div class="ta-md">${sanitize(marked.parse(output.text))}</div></details>` : "";
  const actions = files.map((file) => `<button type="button" data-step-file="${esc(file.blobId)}" data-step-name="${esc(file.name)}">下载 ${esc(file.name)}</button>`).join("") +
    (output.text ? `<button type="button" data-step-export="${Number(message.seq) || 0}">导出 Markdown</button>` : "");
  return `<section class="ta-step-output"><strong>步骤产物${output.step ? ` · 第 ${Number(output.step)} 步` : ""}</strong><span>${esc(output.label || "")}</span>${content}${actions ? `<div class="ta-step-actions">${actions}</div>` : ""}</section>`;
}

function messageHTML(message) {
  if (message.notice) return `<div class="ta-notice"><span>${esc(message.text || "")}</span></div>`;
  if (message.role !== "user" && message.role !== "assistant") return "";
  const text = message.stepOutput === true && stepOutputOf(message) ? "步骤产物已保存。" : message.displayText || message.text || "";
  const mine = message.role === "user" && !message.author;
  const other = message.author && message.author.kind === "user" && !mine;
  const ask = message.role === "assistant" && askOpen(message);
  const body = ask ? askHTML(message) : text ? (message.role === "assistant" ? `<div class="ta-md">${sanitize(marked.parse(text))}</div>` : esc(text)) : "";
  const chips = [];
  if (message.images?.length) chips.push(`${message.images.length} 张图片`);
  if (message.files?.length) chips.push(`${message.files.length} 个文件`);
  const chipHTML = !ask && chips.length ? `<div class="ta-chips">${chips.map((c) => `<span class="ta-chip">${esc(c)}</span>`).join("")}</div>` : "";
  // 热心市民使用预设 SVG 头像（私聊显示对方，群聊显示发言者），一律静止看向右上；只有左栏任务执行中的头像会动。
  const isEmployeeThread = state.current.startsWith("employee:");
  let avatars;
  if (message.role === "user") {
    avatars = other ? `<span class="ta-avatar">${esc(initials(message.author.name))}</span>` : "";
  } else if (isEmployeeThread) {
    avatars = avatarHTML(state.avatar, state.current.slice(9));
  } else {
    const key = message.author ? message.author.kind + ":" + message.author.id : "";
    const preset = state.authors[key]?.avatar;
    avatars = message.author?.kind === "employee" && preset
      ? avatarHTML(preset, message.author.id)
      : `<span class="ta-avatar">${esc(initials(message.author?.name || state.title))}</span>`;
  }
  const author = other ? `<div class="ta-author">${esc(message.author.name)}</div>` : "";
  const classes = ["ta-bubble"];
  if (ask) classes.push("ask");
  else if (message.role === "assistant") classes.push(body ? "md" : "");
  if (message.error) classes.push("error");
  if (message.progress) classes.push("progress");
  return `<div class="ta-message ${message.role === "user" ? "user" : "bot"}">${avatars}
    <div class="ta-message-content">${author}<div class="${classes.join(" ")}">${body}${chipHTML}</div>${stepOutputHTML(message)}</div>
  </div>`;
}

function renderStream(scroll = false) {
  const thread = state.current;
  if (!thread) return;
  const parts = state.messages.map((message) => messageHTML(message));
  // 只分新旧：上次看到的位置之后第一条可见消息前画一条「新」；一直在本线程就不再出现。
  const first = state.newFrom > 0 ? parts.findIndex((part, index) => part && state.messages[index].seq > state.newFrom) : -1;
  let html = parts.map((part, index) => (index > 0 && index === first ? newLine() : "") + part).join("");
  if (state.running) {
    const typingAvatar = state.current.startsWith("employee:") ? avatarHTML(state.avatar, state.current.slice(9)) : `<span class="ta-avatar">${esc(initials(state.title))}</span>`;
    html += `<div class="ta-message bot">${typingAvatar}
      <div class="ta-message-content"><div class="ta-bubble typing">正在工作<span class="ta-dots"><i></i><i></i><i></i></span></div></div></div>`;
  }
  el.stream.innerHTML = html || `<div class="ta-welcome">还没有消息<small>说一句话就能开工</small></div>`;
  driveAvatars();
  if (scroll || state.stick) scrollToEnd();
  el.latest.hidden = state.stick;
}

function scrollToEnd() {
  el.stream.scrollTop = el.stream.scrollHeight;
  state.stick = true;
  el.latest.hidden = true;
}

// ── 待确认 ──────────────────────────────────────────────
// 待确认气泡上的按钮：approve 用「允许/拒绝」，waiting 用输入框「提交回答」或「拒绝」。
async function controlTask(taskId, action, extra) {
  if (state.busy) return;
  state.busy = true;
  try {
    await api("control", { thread: state.current, id: taskId, action, ...extra });
    setTimeout(pollMessages, 200);
    setTimeout(pollThreads, 200);
  } catch (error) {
    toast(error.message);
  } finally {
    state.busy = false;
  }
}

function saveStepFile(data, name, type) {
  const url = URL.createObjectURL(new Blob([data], { type }));
  const link = document.createElement("a");
  link.href = url;
  link.download = String(name || "步骤产物").replace(/[\\/:*?"<>|\x00-\x1f]/g, "_").slice(0, 120);
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

el.stream.addEventListener("click", (event) => {
  const file = event.target.closest?.("[data-step-file]");
  if (file && !file.disabled) {
    file.disabled = true;
    void api("file", { blobId: file.dataset.stepFile }).then((result) => {
      const raw = atob(result.data), bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      saveStepFile(bytes, file.dataset.stepName, "application/octet-stream");
    }).catch((error) => toast(error.message)).finally(() => { file.disabled = false; });
    return;
  }
  const exportButton = event.target.closest?.("[data-step-export]");
  if (exportButton) {
    const message = state.messages.find((item) => item.seq === Number(exportButton.dataset.stepExport));
    const output = message && stepOutputOf(message);
    if (output?.text) saveStepFile(output.text, (output.label || "步骤产物").slice(0, 110) + ".md", "text/markdown;charset=utf-8");
    return;
  }
  const button = event.target.closest?.(".tb-btn");
  if (!button || button.disabled) return;
  const { task, act, ok } = button.dataset;
  if (act === "approve") controlTask(task, "approve", { approved: ok === "1" });
  else if (act === "stop") controlTask(task, "stop", {});
  else if (act === "answer") {
    const input = el.stream.querySelector(`textarea[data-answer="${CSS.escape(task)}"]`);
    const text = input?.value.trim();
    if (!text) { input?.focus(); return; }
    controlTask(task, "answer", { text });
  }
});

function updateHead() {
  const item = threadOf(state.current);
  el.who.textContent = state.title || item?.name || "Vega 助理";
  const status = item?.waiting ? "等待你确认" : state.running ? "正在工作…" : item ? (item.kind === "group" ? `${item.users} 位用户 · ${item.employees} 位热心市民` : (item.mine ? "我的热心市民" : "共享热心市民")) : "选择一位热心市民或一个群聊";
  el.sub.textContent = status;
  el.card.className = "tb-card" + (item?.waiting ? " waiting" : state.running ? " running" : "");
}

async function open(thread) {
  if (!thread) return;
  state.current = thread;
  state.messages = [];
  state.lastSeq = 0;
  state.running = false;
  state.stick = true;
  state.avatar = "";
  state.authors = {};
  state.title = threadOf(thread)?.name || "";
  state.newFrom = seen.of(thread);
  state.markGone = false;
  try { localStorage.setItem("vega.assistant.thread", thread); } catch {}
  updateHead();
  renderRail();
  el.stream.innerHTML = `<div class="ta-welcome">正在打开…</div>`;
  try {
    const data = await api("messages", { thread, limit: 100 });
    if (state.current !== thread) return;
    state.messages = data.messages || [];
    state.lastSeq = data.lastSeq || (state.messages.at(-1)?.seq ?? 0);
    state.running = !!data.running;
    state.title = data.title || state.title;
    if (data.avatar !== undefined) state.avatar = data.avatar;
    if (data.authors !== undefined) state.authors = data.authors;
    seen.at(thread, state.lastSeq);
    updateHead();
    renderStream(true);
    api("read", { thread }).then(() => {
      const item = threadOf(thread);
      if (item) { item.unread = 0; renderRail(); }
    }).catch(() => {});
  } catch (error) {
    el.stream.innerHTML = `<div class="ta-welcome">打不开这个会话<small>${esc(error.message)}</small></div>`;
    toast(error.message);
  }
}

async function pollMessages() {
  const thread = state.current;
  if (!thread) return;
  try {
    const data = await api("messages", { thread, after: state.lastSeq });
    if (state.current !== thread) return;
    // 清空聊天或重置热心市民会删除历史，新的 seq 从 1 重新数：服务器序号比本地还小就整段重开，
    // 否则一直拿旧的 lastSeq 等新消息，对话永远停在被删掉的旧内容上。
    if (typeof data.lastSeq === "number" && data.lastSeq < state.lastSeq) { await open(thread); return; }
    const fresh = (data.messages || []).filter((m) => m.seq > state.lastSeq);
    const running = !!data.running;
    if (data.avatar !== undefined) state.avatar = data.avatar;
    if (data.authors !== undefined) state.authors = data.authors;
    if (fresh.length) {
      state.messages.push(...fresh);
      state.lastSeq = data.lastSeq || fresh.at(-1).seq;
      state.markGone = true;
      seen.at(thread, state.lastSeq);
    }
    if (fresh.length || running !== state.running) {
      state.running = running;
      updateHead();
      renderStream();
    }
  } catch {}
}

async function pollThreads() {
  try {
    const data = await api("threads", {});
    state.threads = { employees: data.employees || [], groups: data.groups || [] };
    // 左栏永远跟着刷新：还没选中会话时也要重画，否则一旦空过一次就一直是「还没有热心市民」。
    renderRail();
    if (!state.current) return;
    updateHead();
  } catch {}
}

// ── 发送 ────────────────────────────────────────────────
async function send(text) {
  const value = (text ?? el.input.value).trim();
  if (!value || !state.current || state.busy) return;
  state.busy = true;
  el.send.disabled = true;
  try {
    await api("send", { thread: state.current, text: value });
    if (text === undefined) { el.input.value = ""; grow(); }
    state.running = true;
    state.stick = true;
    renderStream(true);
    setTimeout(pollMessages, 300);
  } catch (error) {
    toast(error.message);
  } finally {
    state.busy = false;
    el.send.disabled = !el.input.value.trim();
  }
}

function grow() {
  el.input.style.height = "auto";
  el.input.style.height = Math.min(96, el.input.scrollHeight) + "px";
  el.send.disabled = !el.input.value.trim() || !state.current;
}

// ── 事件 ────────────────────────────────────────────────
el.input.addEventListener("input", grow);
el.input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); send(); }
});
el.send.addEventListener("click", () => send());
el.latest.addEventListener("click", scrollToEnd);
el.stream.addEventListener("scroll", () => {
  const gap = el.stream.scrollHeight - el.stream.scrollTop - el.stream.clientHeight;
  state.stick = gap < 24;
  el.latest.hidden = state.stick;
});
el.close.addEventListener("click", () => { fetch(API + "close", { method: "POST" }).catch(() => {}); });
// 设置就在这个窗口里：同一个本地令牌，/assistant/<token>/ → /config/<token>。
el.settings.addEventListener("click", () => {
  location.href = location.pathname.replace("/assistant/", "/config/").replace(/\/$/, "");
});
el.plus.addEventListener("click", (event) => {
  event.stopPropagation();
  el.menu.hidden = !el.menu.hidden;
  el.plus.classList.toggle("open", !el.menu.hidden);
});
el.menu.addEventListener("click", (event) => {
  const act = event.target.closest("button")?.dataset.act;
  el.menu.hidden = true;
  el.plus.classList.remove("open");
  if (act === "new") send("/new");
  if (act === "reload") { open(state.current); pollThreads(); }
});
document.addEventListener("click", () => { el.menu.hidden = true; el.plus.classList.remove("open"); });

async function boot() {
  try {
    const data = await api("threads", {});
    state.threads = { employees: data.employees || [], groups: data.groups || [] };
    const wanted = decodeURIComponent((location.hash.match(/thread=([^&]+)/) || [])[1] || "") || localStorage.getItem("vega.assistant.thread") || "";
    const all = [...state.threads.employees, ...state.threads.groups];
    const first = all.find((item) => item.thread === wanted) || all[0];
    renderRail();
    if (first) await open(first.thread);
  } catch (error) {
    el.stream.innerHTML = `<div class="ta-welcome">连不上站点<small>${esc(error.message)}</small></div>`;
    toast(error.message);
  }
}

boot();
setInterval(pollMessages, 1500);
setInterval(pollThreads, 5000);
</script>
</body>
</html>
